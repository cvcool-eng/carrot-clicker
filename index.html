<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrot Clicker</title>
<meta name="description" content="Click the carrot, buy upgrades and skins, and grow your carrot empire.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥕</text></svg>">
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f6f7f9; --line: #e8eaee; --text: #1d1f24; --muted: #8a8f99;
    --accent: #ff7a1a; --accent-soft: #fff1e6; --green: #2fb36b;
    --shadow: 0 10px 30px rgba(20, 24, 32, .08);
    --ease: cubic-bezier(.2, .9, .3, 1.2);
    /* carrot skin colors (changed by JS) */
    --b1: #ff9a3c; --b2: #f26200; --ridge: #cc4f00; --l1: #5fd36a; --l2: #3aa84a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Inter", "Segoe UI", system-ui, sans-serif; color: var(--text);
    background: var(--world-bg, radial-gradient(circle at 50% 45%, #fff 0%, var(--bg-soft) 75%)); overflow: hidden;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  }
  /* no blue tap flash / text selection on phones */
  * { -webkit-tap-highlight-color: transparent; }
  ::selection { background: transparent; }
  button:focus:not(:focus-visible) { outline: none; }
  html.custom-cursor, html.custom-cursor * { cursor: var(--cursor) !important; }

  /* ---------- stats ---------- */
  header { position: fixed; top: 32px; left: 0; right: 0; text-align: center; pointer-events: none; }
  #carrots { font-size: clamp(40px, 7vw, 64px); font-weight: 800; letter-spacing: -.02em; display: inline-block; }
  #carrots small { font-size: .45em; color: var(--muted); font-weight: 600; margin-left: 6px; }
  .stats { margin-top: 10px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 0 16px; }
  .chip { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--muted); box-shadow: 0 2px 8px rgba(0,0,0,.03); }
  .chip b { color: var(--text); }

  /* ---------- carrot ---------- */
  main { height: 100%; display: grid; place-items: center; }
  .carrot-wrap { position: relative; width: 340px; height: 340px; display: grid; place-items: center; margin-top: 90px; }
  #carrotBtn {
    width: 210px; height: 270px; border: none; background: none; padding: 0; cursor: pointer;
    animation: bob 3s ease-in-out infinite; -webkit-tap-highlight-color: transparent;
  }
  #carrotBtn svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 18px 18px rgba(255, 122, 26, .22)); transition: transform .25s var(--ease); }
  #carrotBtn:hover svg { transform: scale(1.05) rotate(-3deg); }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .shadow { position: absolute; bottom: 10px; width: 120px; height: 16px; border-radius: 50%; background: rgba(0,0,0,.07); animation: shadow 3s ease-in-out infinite; }
  @keyframes shadow { 50% { transform: scaleX(.85); opacity: .7; } }

  @keyframes spin { to { transform: rotate(360deg); } }

  .float { position: fixed; pointer-events: none; font-weight: 800; font-size: 22px; color: var(--accent); z-index: 25; }
  .particle { position: fixed; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 25; }
  .float.crit { font-size: 30px; color: #ff3d6e; white-space: nowrap; }
  .float.gold { font-size: 28px; color: #e0a800; white-space: nowrap; }
  #goldTint {
    position: fixed; inset: 0; z-index: 14; pointer-events: none; opacity: 0; transition: opacity .8s;
    background: radial-gradient(circle at 50% 45%, rgba(255, 220, 80, .12), rgba(255, 190, 30, .3));
  }
  #goldTint.on { opacity: 1; }
  .golden {
    position: fixed; left: 0; z-index: 15; font-size: 46px; border: none; background: none; padding: 0; cursor: pointer;
    filter: sepia(1) saturate(5) hue-rotate(-8deg) brightness(1.2) drop-shadow(0 0 14px #ffd23f);
  }
  .fx { position: fixed; pointer-events: none; z-index: 25; line-height: 1; }
  .trail { position: fixed; pointer-events: none; z-index: 40; line-height: 1; }

  /* ---------- shop ---------- */
  #shopBtn {
    position: fixed; right: 24px; top: 50%; transform: translateY(-50%); z-index: 10;
    border: none; background: var(--text); color: #fff; font: inherit; font-weight: 700; font-size: 16px;
    padding: 16px 22px; border-radius: 18px; cursor: pointer; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: transform .3s var(--ease), opacity .25s, background .2s;
  }
  #shopBtn .icon { font-size: 26px; }
  #shopBtn:hover { transform: translateY(-50%) scale(1.06); background: #000; }
  #shopBtn .dot { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .3s var(--ease); }
  #shopBtn.can-buy .dot { transform: scale(1); }
  body.shop-open #shopBtn { opacity: 0; transform: translateY(-50%) translateX(40px); pointer-events: none; }

  #scrim { position: fixed; inset: 0; background: rgba(20,24,32,.12); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 19; }
  body.shop-open #scrim { opacity: 1; }   /* just a tint: the carrot stays clickable while shopping */

  #shop {
    position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(400px, calc(100vw - 24px)); z-index: 20;
    background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(20,24,32,.18);
    display: flex; flex-direction: column; transform: translateX(calc(100% + 24px));
    transition: transform .45s cubic-bezier(.2, .9, .25, 1);
  }
  body.shop-open #shop { transform: none; }
  .shop-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px; }
  .shop-head h2 { margin: 0; font-size: 22px; }
  .shop-head .bal { color: var(--muted); font-size: 14px; margin-top: 2px; }
  #closeShop, #closePortal, #closeQuests { border: none; background: var(--bg-soft); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: transform .2s var(--ease), background .2s; }
  #closeShop:hover, #closePortal:hover, #closeQuests:hover { transform: rotate(90deg); background: var(--line); }

  .tabs { display: flex; gap: 6px; margin: 8px 20px 4px; padding: 4px; background: var(--bg-soft); border-radius: 14px; position: relative; }
  .tab { flex: 1; border: none; background: none; font: inherit; font-weight: 600; font-size: 13px; color: var(--muted); padding: 9px 4px; border-radius: 10px; cursor: pointer; position: relative; z-index: 1; transition: color .2s; }
  .tab.active { color: var(--text); }
  .tab-pill { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 10px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.08); transition: transform .35s var(--ease), width .35s; }

  .list { flex: 1; overflow-y: auto; padding: 12px 20px 20px; }
  .item {
    display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 10px;
    background: #fff; transition: transform .2s var(--ease), box-shadow .2s, border-color .2s;
    animation: in .4s var(--ease) both;
  }
  .item:hover { box-shadow: var(--shadow); }
  .item.equipped { border-color: var(--accent); background: var(--accent-soft); }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
  .item .ico { width: 52px; height: 52px; border-radius: 14px; background: var(--bg-soft); display: grid; place-items: center; font-size: 28px; flex-shrink: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 700; }
  .item .desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .buy {
    border: none; font: inherit; font-weight: 700; font-size: 14px; padding: 10px 14px; border-radius: 12px; cursor: pointer; white-space: nowrap;
    background: var(--accent); color: #fff; transition: transform .2s var(--ease), background .2s, opacity .2s;
  }
  /* feedback by color/glow only: changing the size made taps near the edge miss (laptop touchpads) */
  .buy:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 4px 12px rgba(0, 0, 0, .15); }
  .buy:active:not(:disabled) { filter: brightness(.9); box-shadow: none; }
  .buy:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  .buy.ghost { background: var(--text); }
  .buy.done, .buy.done:disabled { background: var(--green); color: #fff; cursor: default; }

  .swatch { width: 26px; height: 34px; position: relative; }
  .swatch .leaf { position: absolute; left: 8px; top: 0; width: 10px; height: 10px; border-radius: 50% 50% 0 0; background: var(--sl); }
  .swatch .body { position: absolute; top: 8px; left: 0; right: 0; bottom: 0; clip-path: polygon(0 0, 100% 0, 52% 100%, 48% 100%); border-radius: 6px; background: linear-gradient(135deg, var(--sb1), var(--sb2)); }

  .mod-btn {
    display: block; width: 100%; margin-top: 6px; padding: 14px; border: 2px dashed #8a4dff; border-radius: 16px;
    background: #f5efff; color: #6a2fc0; font: inherit; font-weight: 700; cursor: pointer;
    transition: transform .2s var(--ease), background .2s;
  }
  .mod-btn:hover { background: #ece1ff; }
  .mod-btn.normal { border: 2px solid var(--text); background: var(--text); color: #fff; }
  .mod-btn.normal:hover { background: #000; }
  .reset {
    display: block; width: 100%; margin-top: 10px; padding: 14px; border: none; border-radius: 16px;
    background: #e5383b; color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    transition: transform .2s var(--ease), background .2s;
  }
  .reset:hover { background: #d02a2d; }
  .reset.confirming { background: #a4161a; animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 120px); background: var(--text); color: #fff;
    padding: 12px 20px; border-radius: 14px; font-weight: 600; box-shadow: var(--shadow); transition: transform .4s var(--ease); z-index: 75;
  }
  #toast.show { transform: translate(-50%, 0); }
  #toast { pointer-events: none; }   /* never block taps on whatever is underneath it */

  /* shows in Space World once you have enough carrots to finish */
  #endBtn {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 10;
    border: none; border-radius: 999px; padding: 14px 26px; cursor: pointer;
    background: linear-gradient(135deg, #ffd23f, #ff9a1a); color: #3b2300; font: inherit; font-weight: 800; font-size: 16px;
    box-shadow: 0 0 0 0 rgba(255, 196, 40, .6), 0 10px 30px rgba(255, 160, 30, .35); animation: endPulse 1.8s ease-out infinite;
  }
  #endBtn[hidden] { display: none; }
  #endBtn:hover { transform: translateX(-50%) scale(1.06); }
  @keyframes endPulse { 70%, 100% { box-shadow: 0 0 0 18px rgba(255, 196, 40, 0), 0 10px 30px rgba(255, 160, 30, .35); } }

  /* ---------- carrot portal ---------- */
  #portalBtn {
    position: fixed; right: 24px; top: calc(50% + 64px); z-index: 10;
    border: none; color: #fff; font: inherit; font-weight: 700; font-size: 13px; line-height: 1.15;
    background: linear-gradient(135deg, #8a4dff, #2f8be0); padding: 12px 10px; width: 92px; border-radius: 18px; cursor: pointer;
    box-shadow: 0 10px 30px rgba(90, 60, 220, .3);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: transform .3s var(--ease), opacity .25s;
  }
  #portalBtn .icon { font-size: 24px; display: inline-block; animation: spin 4s linear infinite; }
  #portalBtn:hover { transform: scale(1.06); }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.shop-open #portalBtn, body.portal-open #portalBtn, body.portal-open #shopBtn { opacity: 0; pointer-events: none; }

  #portalScrim { position: fixed; inset: 0; background: rgba(20,24,32,.3); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 21; }
  body.portal-open #portalScrim { opacity: 1; pointer-events: auto; }
  #portal, #questPanel {
    position: fixed; left: 50%; top: 50%; z-index: 22; width: min(460px, calc(100vw - 24px)); max-height: calc(100vh - 40px);
    background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(20,24,32,.25); display: flex; flex-direction: column;
    transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none; transition: transform .35s var(--ease), opacity .25s;
  }
  body.portal-open #portal, body.quests-open #questPanel { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  .world-ico { width: 100%; height: 100%; border-radius: 14px; display: grid; place-items: center; }

  #warp {
    position: fixed; left: 50%; top: 50%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; border-radius: 50%;
    z-index: 50; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, #fff 0 12%, transparent 40%), conic-gradient(#8a4dff, #2f8be0, #5fd36a, #ff7a1a, #8a4dff);
  }

  /* ---------- worlds ---------- */
  #carrots { color: var(--hud, inherit); text-shadow: var(--hud-shadow, none); }
  body.world-water  { --world-bg: linear-gradient(180deg, #9fe2f7 0%, #3ea6d8 38%, #16679c 75%, #0b416b 100%); --hud: #fff; --hud-shadow: 0 2px 14px rgba(0,40,80,.55); }
  body.world-lava   { --world-bg: radial-gradient(ellipse at 50% 120%, #ff7a1a 0%, #a8240a 25%, #3d0b04 55%, #140302 100%); --hud: #fff; --hud-shadow: 0 2px 16px rgba(255,100,20,.6); }
  body.world-jungle { --world-bg: linear-gradient(180deg, #e2f6cf 0%, #9ad47a 45%, #4f9a3c 100%); --hud: #12350f; }
  body.world-candy  { --world-bg: linear-gradient(180deg, #ffe6f3 0%, #ffc4e1 55%, #ffa6d2 100%); --hud: #6b1446; }
  body.world-arctic { --world-bg: linear-gradient(180deg, #050f2a 0%, #0f2d5c 50%, #2c5f95 78%, #8fc0e4 100%); --hud: #fff; --hud-shadow: 0 2px 16px rgba(60,255,190,.45); }
  body.world-space  { --world-bg: radial-gradient(circle at 50% 40%, #1d2256 0%, #0b0d26 60%, #03040d 100%); --hud: #fff; --hud-shadow: 0 2px 16px rgba(120,140,255,.6); }
  /* scenery: the big still/slow-moving background pieces for each world */
  #scenery { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #scenery > * { position: absolute; }
  .sc-bottom { left: 0; bottom: 0; width: 100%; }
  .sc-shafts {      /* sunlight shafts coming down through the water */
    inset: 0 0 25% 0; background: repeating-linear-gradient(105deg, rgba(255,255,255,.14) 0 34px, transparent 34px 120px);
    -webkit-mask: linear-gradient(#000, transparent); mask: linear-gradient(#000, transparent);
    left: -10%; right: -10%; animation: shafts 9s ease-in-out infinite alternate; will-change: transform;
  }
  @keyframes shafts { to { transform: translateX(8%); } }   /* moving the layer, not repainting it */
  .sc-weed { bottom: 34px; transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  .sc-heat {
    left: 50%; bottom: -30vh; width: 140vw; height: 70vh; margin-left: -70vw; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,120,30,.5), transparent); animation: heat 3s ease-in-out infinite alternate;
  }
  @keyframes heat { to { opacity: .55; transform: scale(1.06); } }
  .sc-lava { left: 0; bottom: 0; width: 200%; height: 48px; animation: waveMove 7s linear infinite; filter: drop-shadow(0 -4px 14px #ff6a00); will-change: transform; }
  @keyframes waveMove { to { transform: translateX(-50%); } }
  .sc-sun { left: -15vw; top: -25vh; width: 75vw; height: 75vh; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,250,200,.65), transparent); }
  .sc-vine { top: -6px; transform-origin: 50% 0; animation: sway 5s ease-in-out infinite alternate; }
  .sc-cloud { border-radius: 999px; background: #fff; opacity: .75; box-shadow: 30px -14px 0 4px #fff, 64px 2px 0 -2px #fff; animation: cloud linear infinite; }
  @keyframes cloud { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
  .sc-lolli { width: var(--s); height: calc(var(--s) * 2.3); }
  .sc-lolli::before {
    content: ''; position: absolute; left: 50%; top: calc(var(--s) * .9); bottom: 0; width: 9px; margin-left: -4.5px;
    border-radius: 5px; background: #fff; box-shadow: inset -3px 0 0 #ecd9ea;
  }
  .sc-lolli i {
    position: absolute; inset: 0 0 auto 0; height: var(--s); border-radius: 50%; animation: spin 9s linear infinite;
    background: repeating-conic-gradient(var(--c) 0 30deg, #fff 30deg 60deg); box-shadow: 0 6px 18px rgba(200,40,120,.25);
  }
  .sc-aurora {
    left: -20%; width: 140%; height: 30vh; border-radius: 50%; filter: blur(26px); opacity: .7;
    animation: aurora 10s ease-in-out infinite alternate; will-change: transform;
  }
  @keyframes aurora { from { transform: translateX(-6%) skewY(-6deg) scaleY(.85); } to { transform: translateX(6%) skewY(4deg) scaleY(1.2); } }
  .sc-nebula {
    right: -15vw; top: -15vh; width: 75vw; height: 65vh; border-radius: 50%; filter: blur(24px);
    background: radial-gradient(closest-side, rgba(176,90,255,.4), rgba(255,90,170,.18) 60%, transparent);
  }
  .sc-float { animation: floaty 9s ease-in-out infinite alternate; }
  @keyframes floaty { to { transform: translateY(-14px) rotate(4deg); } }
  #ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #ambient > div { position: absolute; }
  .star { width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle var(--d) ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .15; } }

  /* ---------- ending ---------- */
  #endModal {
    position: fixed; inset: 0; z-index: 45; background: rgba(10,12,30,.55); display: grid; place-items: center;
    opacity: 0; pointer-events: none; transition: opacity .35s;
  }
  #endModal.show { opacity: 1; pointer-events: auto; }
  .end-card {
    background: #fff; border-radius: 28px; padding: 32px 26px 24px; width: min(440px, calc(100vw - 32px)); text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.35); transform: scale(.85); transition: transform .45s var(--ease);
  }
  #endModal.show .end-card { transform: scale(1); }
  .end-card .big { font-size: 64px; line-height: 1; }
  .end-card h2 { margin: 12px 0 6px; font-size: 28px; }
  .end-card p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; }
  .end-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .end-stats div { background: var(--bg-soft); border-radius: 14px; padding: 12px 4px; font-size: 12px; color: var(--muted); }
  .end-stats b { display: block; font-size: 18px; color: var(--text); }
  .big-btn {
    display: block; width: 100%; margin-top: 8px; padding: 14px; border: none; border-radius: 16px;
    font: inherit; font-weight: 700; cursor: pointer; transition: transform .2s var(--ease);
  }
  .big-btn:hover { filter: brightness(1.06); }
  .big-btn.primary { background: var(--accent); color: #fff; }
  .big-btn.dark { background: var(--text); color: #fff; }
  .big-btn.light { background: var(--bg-soft); color: var(--text); }

  /* ---------- carrot skin effects ---------- */
  .rays {
    position: absolute; left: 50%; top: 50%; width: 380px; height: 380px; margin: -190px 0 0 -190px;
    border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .5s;
    background: repeating-conic-gradient(rgba(255, 236, 160, .6) 0 7deg, transparent 7deg 22deg);
    -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%); mask: radial-gradient(circle, #000 18%, transparent 68%);
    animation: spin 26s linear infinite; will-change: transform;
  }
  .skin-heavenly .rays { opacity: 1; }
  .skin-golden .rays { opacity: .45; }
  #wings, #halo, #icicles, #drips { display: none; }
  .skin-heavenly #wings, .skin-heavenly #halo, .skin-ice #icicles, .skin-ice #drips { display: inline; }
  #wingL, #wingR { transform-box: fill-box; animation: flapL 1.6s ease-in-out infinite; }
  #wingL { transform-origin: 100% 45%; }
  #wingR { transform-origin: 0% 45%; animation-name: flapR; }
  @keyframes flapL { 50% { transform: rotate(-16deg); } }
  @keyframes flapR { 50% { transform: rotate(16deg); } }
  #halo { transform-box: fill-box; animation: haloFloat 2.4s ease-in-out infinite; filter: drop-shadow(0 0 6px #ffd84d); }
  @keyframes haloFloat { 50% { transform: translateY(-6px); } }
  #drips circle { transform-box: fill-box; animation: drip 1.9s ease-in infinite; }
  @keyframes drip {
    0% { transform: translateY(0) scale(.3); opacity: 0; } 20% { transform: translateY(0) scale(1); opacity: 1; }
    85% { opacity: 1; } 100% { transform: translateY(80px) scale(1); opacity: 0; }
  }
  /* every skin except Classic glows and pulses in its own color */
  .skin-golden { --glow: rgba(255, 205, 50, .85); }   .skin-purple { --glow: rgba(165, 95, 255, .85); }
  .skin-frozen { --glow: rgba(120, 210, 255, .85); }  .skin-midnight { --glow: rgba(110, 120, 255, .8); }
  .skin-ice { --glow: rgba(150, 220, 255, .9); }      .skin-heavenly { --glow: rgba(255, 240, 170, 1); }
  /* the pulse is a soft blob behind the carrot fading in and out (cheap), instead of animating a filter (slow) */
  .fxskin #carrotBtn svg { filter: drop-shadow(0 0 14px var(--glow)); }
  .glowfx {
    position: absolute; left: 50%; top: 50%; width: 260px; height: 300px; margin: -150px 0 0 -130px; border-radius: 50%;
    pointer-events: none; opacity: 0; background: radial-gradient(closest-side, var(--glow), transparent);
    will-change: opacity, transform;
  }
  .fxskin .glowfx { animation: pulseGlow 2.2s ease-in-out infinite; }
  @keyframes pulseGlow { 0%, 100% { opacity: .25; transform: scale(.9); } 50% { opacity: .6; transform: scale(1.05); } }
  .skinfx { position: absolute; pointer-events: none; line-height: 1; }

  /* ---------- daily quests stand (top right) ---------- */
  #questBtn {
    position: fixed; top: 14px; right: 16px; z-index: 12; width: 106px; border: none; background: none; padding: 0;
    cursor: pointer; font: inherit; filter: drop-shadow(0 8px 14px rgba(20, 24, 32, .2)); transition: transform .3s var(--ease);
  }
  #questBtn:hover { transform: scale(1.05); }
  #questBtn .awning {
    position: relative; height: 20px; border-radius: 10px 10px 3px 3px;
    background: repeating-linear-gradient(90deg, #ff5a4a 0 13px, #fff 13px 26px);
  }
  #questBtn .awning::after {    /* scalloped edge */
    content: ''; position: absolute; left: 0; right: 0; bottom: -6px; height: 7px;
    background: radial-gradient(circle at 6.5px 0, #ff5a4a 6.5px, transparent 7px) 0 0 / 26px 7px repeat-x,
                radial-gradient(circle at 6.5px 0, #fff 6.5px, transparent 7px) 13px 0 / 26px 7px repeat-x;
  }
  #questBtn .posts { height: 10px; margin: 0 9px; border-left: 4px solid #a06a3a; border-right: 4px solid #a06a3a; }
  #questBtn .counter {
    background: linear-gradient(#bd7f45, #8b5a2b); border-radius: 6px 6px 10px 10px; padding: 5px 4px 7px;
    color: #fff; font-weight: 800; font-size: 12px; line-height: 1.15; text-shadow: 0 1px 0 rgba(0, 0, 0, .25);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .2);
  }
  #questBtn .counter span { display: block; font-size: 17px; }
  .qbadge {
    position: absolute; top: -8px; left: -8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; z-index: 1;
    background: #e5383b; color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center;
    border: 2px solid #fff; animation: qpop 1.2s ease-in-out infinite;
  }
  .qbadge[hidden] { display: none; }
  @keyframes qpop { 50% { transform: scale(1.15); } }
  body.shop-open #questBtn, body.portal-open #questBtn, body.quests-open #questBtn { opacity: 0; pointer-events: none; }
  #questScrim { position: fixed; inset: 0; z-index: 69; background: rgba(20,24,32,.3); opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.quests-open #questScrim { opacity: 1; pointer-events: auto; }
  #questPanel { z-index: 70; }
  .qbar { height: 8px; border-radius: 4px; background: var(--bg-soft); overflow: hidden; margin: 6px 0 3px; }
  .qbar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ffb347, #ff7a1a); transition: width .3s; }
  .item.qdone .qbar i { background: linear-gradient(90deg, #5fd36a, #2fb36b); }
  .noanim .item { animation: none; }

  /* ---------- lobby ---------- */
  #lobby {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #fff8f0 0%, #ffe4c8 60%, #ffc792 100%);
    transition: opacity .6s, transform .6s var(--ease);
  }
  #lobby.hide { opacity: 0; transform: scale(1.08); pointer-events: none; }
  #lobbyBg { position: absolute; inset: 0; overflow: hidden; }
  #lobbyBg span { position: absolute; top: 0; font-size: 26px; opacity: .22; animation: lobbyFloat linear infinite; }
  @keyframes lobbyFloat { from { transform: translateY(110vh) rotate(0deg); } to { transform: translateY(-15vh) rotate(360deg); } }
  .lobby-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: min(12px, 1.8vh); padding: 16px; text-align: center; }
  /* sizes shrink with the screen height so Play and Quests always fit, even in a short browser window */
  .lobby-carrot { width: min(150px, 18vh); height: min(195px, 24vh); overflow: visible; animation: lobbyBob 3s ease-in-out 2.2s infinite; }
  #lobby { overflow-y: auto; }
  .lobby-carrot .draw {
    fill-opacity: 0; stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw 1.2s ease var(--d) forwards, fillIn .5s ease calc(var(--d) + .9s) forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fillIn { to { fill-opacity: 1; } }
  @keyframes lobbyBob { 50% { transform: translateY(-10px) rotate(4deg); } }
  #lobby h1 {
    margin: 4px 0 min(10px, 1.5vh); font-size: clamp(30px, min(10vw, 10vh), 76px); font-weight: 900; letter-spacing: -.03em; line-height: 1;
    background: linear-gradient(135deg, #ff9a3c, #e8550a); -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; animation: riseIn .7s var(--ease) 1.1s forwards;
  }
  @keyframes riseIn { from { opacity: 0; translate: 0 18px; } to { opacity: 1; translate: 0 0; } }
  .lobby-btn {
    position: relative; width: 240px; padding: min(16px, 2.4vh); border: none; border-radius: 18px; font: inherit; font-size: min(20px, 3.4vh); font-weight: 800;
    cursor: pointer; opacity: 0; animation: riseIn .6s var(--ease) forwards; transition: transform .2s var(--ease);
  }
  .lobby-btn:hover { filter: brightness(1.06); box-shadow: 0 12px 28px rgba(255, 122, 26, .4); }
  .lobby-btn:active { filter: brightness(.92); }
  #playBtn { background: var(--accent); color: #fff; box-shadow: 0 10px 24px rgba(255, 122, 26, .35); animation-delay: 1.35s; }
  #lobbyQuests { background: #fff; color: var(--text); box-shadow: var(--shadow); animation-delay: 1.5s; }

  @media (max-width: 600px) {
    #questBtn { width: 80px; top: 8px; right: 8px; }
    header { top: 92px; }                  /* leave room for the quest stand above the counter */
    .carrot-wrap { margin-top: 170px; }
    #questBtn .counter { font-size: 10px; }
    #questBtn .counter span { font-size: 14px; }
    #shopBtn { top: auto; bottom: 20px; transform: none; flex-direction: row; padding: 14px 20px; }
    #shopBtn:hover { transform: scale(1.04); }
    body.shop-open #shopBtn { transform: translateX(40px); }
    #portalBtn { top: auto; bottom: 20px; right: 140px; width: auto; flex-direction: row; padding: 14px 16px; font-size: 14px; }
    .carrot-wrap { width: 280px; height: 280px; }
    #carrotBtn { width: 170px; height: 220px; }
  }
</style>
</head>

<script>
// boost: the equipped skin multiplies carrots per click
const CARROT_SKINS = [
  { id: 'classic', name: 'Classic',  cost: 0,      boost: 1,  b1: '#ff9a3c', b2: '#f26200', ridge: '#cc4f00', l1: '#5fd36a', l2: '#3aa84a' },
  { id: 'golden',  name: 'Golden',   cost: 5000,   boost: 2,  b1: '#ffe27a', b2: '#f2b600', ridge: '#c99500', l1: '#8fdc78', l2: '#4fae4a' },
  { id: 'purple',  name: 'Purple',   cost: 15000,  boost: 3,  b1: '#c890ff', b2: '#8040e0', ridge: '#6a2fc0', l1: '#5fd36a', l2: '#3aa84a' },
  { id: 'frozen',  name: 'Frozen',   cost: 40000,  boost: 5,  b1: '#e3f6ff', b2: '#7cc8f2', ridge: '#4ea6d6', l1: '#b4f0e8', l2: '#6bcfc0' },
  { id: 'midnight',name: 'Midnight', cost: 100000, boost: 10, b1: '#5a5f8a', b2: '#23263f', ridge: '#11131f', l1: '#7a86ff', l2: '#4450d8' },
  // these two are a normal orange carrot with extras drawn on (see #icicles/#drips and #wings/#halo)
  { id: 'ice',     name: 'Ice Carrot',      cost: 1e6, boost: 15, badge: '🧊', b1: '#ffa95c', b2: '#f26a10', ridge: '#cc5500', l1: '#8fe0d8', l2: '#4fb8b0' },
  { id: 'heavenly',name: 'Heavenly Carrot', cost: 1e7, boost: 25, badge: '😇', b1: '#ffb36b', b2: '#f2761a', ridge: '#d06010', l1: '#7de08a', l2: '#4cc35a' },
];

// a bunny wearing a little hat, for shop icons
const hatBunnyIcon = hat => '<span style="position:relative;display:inline-block;line-height:1">🐰' +
  `<span style="position:absolute;left:50%;top:-.18em;transform:translateX(-50%) rotate(-12deg);font-size:.55em">${hat}</span></span>`;
const CROWNED_BUNNY = hatBunnyIcon('👑');
const HAT_BUNNY = hatBunnyIcon('🎩');

// an old-school pixel-art arrow pointer (B = black outline, W = white fill)
function pixelArrowSvg(scale = 2, [outline, fill] = ['#1d1f24', '#fff']) {
  const rows = ['B', 'BB', 'BWB', 'BWWB', 'BWWWB', 'BWWWWB', 'BWWWWWB', 'BWWWWWWB', 'BWWWWWWWB', 'BWWWWWWWWB',
    'BWWWWWBBBBB', 'BWWBWWB', 'BWB.BWWB', 'BB..BWWB', 'B....BWWB', '.....BWWB', '......BB'];
  let rects = '';
  rows.forEach((row, y) => [...row].forEach((c, x) => {
    if (c !== '.') rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c === 'B' ? outline : fill}"/>`;
  }));
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${11 * scale}" height="${17 * scale}" viewBox="0 0 11 17" shape-rendering="crispEdges">${rects}</svg>`;
}

// a chunky, cartoony arrow mouse pointer in any color (or a 2-color gradient), as an SVG string
function arrowSvg(color, size = 32, grad = null) {
  const arrow = 'M5 3 L5 24 L10.5 19 L14.5 27.5 L19 25.5 L15 17.5 L22.5 17.5 Z';
  const id = grad ? 'ag' + grad.join('').replace(/#/g, '') : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 32 32">` +
    (grad ? `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${grad[0]}"/>` +
      `<stop offset="1" stop-color="${grad[1]}"/></linearGradient></defs>` : '') +
    `<path d="${arrow}" transform="translate(1.5 1.5)" fill="rgba(0,0,0,.18)" stroke="rgba(0,0,0,.18)" stroke-width="2.6" stroke-linejoin="round"/>` +
    `<path d="${arrow}" fill="${grad ? `url(#${id})` : color}" stroke="#1d1f24" stroke-width="2.6" stroke-linejoin="round"/>` +
    `<path d="M7.6 8 L7.6 15" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".7"/></svg>`;
}

const CURSOR_SKINS = [
  { id: 'default', name: 'Default',  cost: 0,      arrow: '#ffffff', icon: arrowSvg('#ffffff') },
  { id: 'orange',  name: 'Orange Pointer', cost: 300,   arrow: '#ff7a1a', icon: arrowSvg('#ff7a1a') },
  { id: 'purple',  name: 'Purple Pointer', cost: 1500,  arrow: '#8a4dff', icon: arrowSvg('#8a4dff') },
  { id: 'pixel',   name: 'Pixel Mouse',    cost: 3000,  pixel: true, icon: pixelArrowSvg() },
  { id: 'carrot',  name: 'Carrot',   cost: 6000,  emoji: '🥕' },
  { id: 'bunny',   name: 'Bunny',    cost: 20000,  emoji: '🐰' },
  { id: 'goldpixel', name: 'Gold Pixel Mouse', cost: 40000, pixel: ['#7a4a00', '#ffd23f'], icon: pixelArrowSvg(2, ['#7a4a00', '#ffd23f']) },
  { id: 'crown',   name: 'Crown',    cost: 75000, emoji: '👑' },
  { id: 'gold',    name: 'Golden Pointer', cost: 150000, arrow: '#ffcc33', icon: arrowSvg('#ffcc33') },
  { id: 'neon',    name: 'Neon Pointer',   cost: 400000, arrow: '#2ef2ff', grad: ['#2ef2ff', '#ff3dd8'], icon: arrowSvg('#2ef2ff', 32, ['#2ef2ff', '#ff3dd8']) },
  { id: 'lolli',   name: 'Lollipop', cost: 750000, emoji: '🍭' },
  { id: 'rocket',  name: 'Rocket',   cost: 2e6,    emoji: '🚀' },
  { id: 'bolt',    name: 'Lightning Bolt', cost: 5e6, emoji: '⚡' },
  { id: 'dragon',  name: 'Dragon',   cost: 2e7,    emoji: '🐉' },
  { id: 'diamond', name: 'Diamond',  cost: 1e8,    emoji: '💎' },
  { id: 'galaxy',  name: 'Galaxy Pointer', cost: 3e8, arrow: '#7b3fe0', grad: ['#2a2f8a', '#ff5fd1'], icon: arrowSvg('#7b3fe0', 32, ['#2a2f8a', '#ff5fd1']) },
  { id: 'king',    name: 'King Bunny', cost: 1e9, hat: '👑', icon: CROWNED_BUNNY },   // always the most expensive
  // secret: only shows in the shop once earned by beating the game ADMIN_WINS times
  { id: 'admin',   name: 'The Admin Bunny', secret: true, hat: '🎩', icon: HAT_BUNNY },
];

// shop icon for a line trail: a short slanted streak, fading in from the tail
const lineIcon = (head, tail = head) => `<span style="display:block;width:34px;height:6px;border-radius:3px;` +
  `background:linear-gradient(90deg, transparent, ${tail} 40%, ${head});box-shadow:0 0 8px ${head};transform:rotate(-30deg)"></span>`;

// trails with `line` are drawn as one smooth line that chases the cursor (see drawLineTrail).
// line: life = how long a point lasts (ms, so longer = longer line), width at the head, color(f) where
// f goes from 0 at the tail to 1 at the head, optional glow color + blur, and jitter for a zappy look
const TRAILS = [
  { id: 'none',    name: 'No Trail',     cost: 0,      icon: '🚫' },
  { id: 'glow',    name: 'Orange Glow',  cost: 1500,   icon: lineIcon('#ff8a2b'),
    line: { life: 300, width: 6, color: () => '#ff8a2b', glow: '#ff8a2b', blur: 12 } },
  { id: 'pixel',   name: 'Pixel',        cost: 3000,   icon: '👾', style: 'pixel' },
  { id: 'comet',   name: 'Comet',        cost: 6000,   icon: lineIcon('#fff2b0', '#ff8a2b'),
    line: { life: 450, width: 9, color: f => `hsl(${25 + 30 * f} 100% ${55 + 20 * f}%)`, glow: '#ffb347', blur: 14 } },
  { id: 'white',   name: 'Clean Line',   cost: 8000,   icon: lineIcon('#ffffff', '#dfe3ea'),
    line: { life: 280, width: 4, color: () => '#fff', glow: 'rgba(0,0,0,.35)', blur: 5 } },

const fmt = n => {

  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }

};

// throws n elements outward from (x, y), with optional gravity and spin
function fling(x, y, { n = 8, make, dist = [40, 90], dur = 700, gravity = 0, spin = 0, even = false }) {
  for (let i = 0; i < n; i++) {
    const el = make(i);
    el.classList.add('fx');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    const a = even ? i / n * Math.PI * 2 : Math.random() * Math.PI * 2;
    const d = dist[0] + Math.random() * (dist[1] - dist[0]);
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d, r = spin * (Math.random() - .5) * 2;
    el.animate([
      { transform: 'translate(-50%,-50%) rotate(0deg) scale(.6)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${r / 2}deg) scale(1)`, opacity: 1, offset: .55 },
      { transform: `translate(calc(-50% + ${dx * 1.15}px), calc(-50% + ${dy + gravity}px)) rotate(${r}deg) scale(.4)`, opacity: 0 },
    ], { duration: dur * (.85 + Math.random() * .3), easing: 'cubic-bezier(.15,.8,.3,1)' }).onfinish = () => el.remove();
  }
}

// 5 zig-zag bolts shooting out, flickering
function lightning(x, y) {
  const ns = 'http://www.w3.org/2000/svg', S = 260;
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', S);
  svg.setAttribute('height', S);
  svg.classList.add('fx');
  svg.style.cssText = `left:${x - S / 2}px;top:${y - S / 2}px;overflow:visible;filter:drop-shadow(0 0 6px #ffe94d)`;
  for (let b = 0; b < 5; b++) {
    const a = b / 5 * Math.PI * 2 + Math.random() * .6, len = 70 + Math.random() * 45;
    let pts = `${S / 2},${S / 2}`;
    for (let k = 1; k <= 5; k++) {
      const d = len * k / 5, j = (k % 2 ? 1 : -1) * (6 + Math.random() * 8);
      pts += ` ${S / 2 + Math.cos(a) * d - Math.sin(a) * j},${S / 2 + Math.sin(a) * d + Math.cos(a) * j}`;
    }
    const p = document.createElementNS(ns, 'polyline');
    p.setAttribute('points', pts);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', b % 2 ? '#fff6a8' : '#ffe94d');
    p.setAttribute('stroke-width', '3.5');
    p.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(p);
  }
  document.body.appendChild(svg);
  svg.animate([{ opacity: 1 }, { opacity: .2 }, { opacity: 1 }, { opacity: .5 }, { opacity: 0 }],

// ---------- mouse trail ----------
let lastTrail = 0;
addEventListener('pointermove', e => {
  const t = TRAILS.find(k => k.id === state.trailSkin);
  if (!t || t.id === 'none') return;
  if (t.line) {   // line trails just record the point; drawLineTrail() draws them every frame
    const j = t.line.jitter || 0;
    linePts.push({ x: e.clientX + rnd(-j, j), y: e.clientY + rnd(-j, j), t: performance.now() });
    lineCfg = t.line;
    return;
  }
  const style = TRAIL_STYLES[t.style] || (t.emoji ? TRAIL_STYLES.emoji : TRAIL_STYLES.dot);
  const now = performance.now();
  if (now - lastTrail < style.gap) return;
  const made = style.make(e.clientX, e.clientY, t);
  if (!made) return;
  lastTrail = now;
  const [el, frames, opts] = made;
  el.classList.add('trail');
  document.body.appendChild(el);
  el.animate(frames, opts).onfinish = () => el.remove();
});

const place = (el, x, y) => { el.style.left = x + 'px'; el.style.top = y + 'px'; return el; };
let lastPixel = '';

// line trails: keep the last fraction of a second of mouse points and draw them as one smooth line
// that gets thinner (and shifts color) toward the tail, so it looks like a short line chasing the cursor
const lineCanvas = $('lineTrail'), lineCtx = lineCanvas.getContext('2d');
let linePts = [], lineCfg = null;
function sizeLineCanvas() {
  const d = devicePixelRatio || 1;
  lineCanvas.width = innerWidth * d;
  lineCanvas.height = innerHeight * d;
  lineCtx.setTransform(d, 0, 0, d, 0, 0);
}
let lineDirty = false;
function drawLineTrail(now) {
  if (!linePts.length) {   // nothing to draw: wipe whatever was left once, then do nothing
    if (lineDirty) { lineCtx.clearRect(0, 0, innerWidth, innerHeight); lineDirty = false; }
    return;
  }
  lineDirty = true;
  const c = lineCfg;
  linePts = linePts.filter(p => now - p.t < c.life);
  lineCtx.clearRect(0, 0, innerWidth, innerHeight);
  lineCtx.lineCap = lineCtx.lineJoin = 'round';
  lineCtx.shadowColor = c.glow || 'transparent';
  lineCtx.shadowBlur = c.blur || 0;
  for (let i = 1; i < linePts.length; i++) {
    const a = linePts[i - 1], b = linePts[i];
    const f = Math.max(0, 1 - (now - b.t) / c.life);   // 1 at the cursor, 0 at the tail
    lineCtx.strokeStyle = c.color(f);
    lineCtx.lineWidth = .5 + c.width * f;
    lineCtx.beginPath();

      const n = state[u.key];

      const tag = u.tag ? ` <span style="color:var(--muted);font-weight:600">· ${u.tag(n)}</span>` : '';

  const from = dir > 0 ? -60 : innerWidth + 60, to = dir > 0 ? innerWidth + 60 : -60;
  const flip = dir > 0 ? -s : s;   // the fish faces left, so flip it when swimming right
  el.animate([
    { transform: `translate(${from}px, 0) scale(${flip}, ${s})` },

    { transform: `translate(${to}px, 0) scale(${flip}, ${s})` },

// finishing the game: counts a win, then sends you back to the very beginning.
// Wins, today's quests and the Admin Bunny set (earned on win ADMIN_WINS) are kept. Modded wins don't count.
function endGame() {
  const stats = { clicks: state.clicks, golden: state.goldenCaught, carrots: state.carrots };
  const counted = !state.modded;
  const wins = state.timesBeaten + (counted ? 1 : 0);
  const hadAdmin = state.cursorSkins.includes('admin');
  const newAdmin = counted && wins >= ADMIN_WINS && !hadAdmin;
  const wearing = {};
  for (const [kind, id] of Object.entries(ADMIN_ITEMS)) wearing[kind] = newAdmin || state[kind + 'Skin'] === id;
  const quests = { questDay: state.questDay, questStats: state.questStats, questClaimed: state.questClaimed };

  resetGame();
  Object.assign(state, quests);
  state.timesBeaten = wins;
  if (hadAdmin || newAdmin) grantAdmin(wearing);
  refreshAll();

  const left = ADMIN_WINS - wins;
  const extra = newAdmin
    ? `<div class="item equipped" style="text-align:left;margin-bottom:12px;animation:none">
         <div class="ico" style="font-size:30px">${HAT_BUNNY}</div>
         <div class="info"><div class="name">Unlocked: The Admin Bunny!</div>
         <div class="desc">You beat the game ${ADMIN_WINS} times. You also got its 🖤 shadow trail and 🎩 top hat tap effect.
           All three are equipped now and in your shop.</div></div></div>`
    : !counted ? '<p>Wins in modded mode don\'t count toward your total.</p>'
    : left > 0 ? `<p>Beat it <b>${left} more time${left === 1 ? '' : 's'}</b> to unlock a secret cursor 👀</p>` : '';
  showEndModal(`<div class="big">🏆</div>
    <h2>You beat Carrot Clicker!</h2>
    <p>From one carrot on a farm all the way to space. Wins: <b>${wins}</b></p>
    <div class="end-stats">
      <div><b>${fmt(stats.clicks)}</b>clicks</div>
      <div><b>${fmt(stats.golden)}</b>golden carrots</div>
      <div><b>${fmt(stats.carrots)}</b>carrots</div>
    </div>
    ${extra}
    <button class="big-btn primary" data-act="keep">🥕 Start again</button>`);
  const r = $('endCard').getBoundingClientRect();
  fling(r.left + r.width / 2, r.top + 60, { n: 14, make: () => emo('⭐', 22), dist: [90, 180], dur: 1200, spin: 360, even: true });
}

// modded mode: remember the real save, then give 1B carrots and unlock everything
function enterModded() {
  state.backup = JSON.parse(JSON.stringify(state));
  state.modded = true;
  state.carrots = 1e9;
  for (const u of UPGRADES) state[u.key] = u.max || Math.max(state[u.key], 10);
  for (const [kind, list] of Object.values(SKIN_TABS)) {
    state[kind + 'Skins'] = list.filter(s => !s.secret || state[kind + 'Skins'].includes(s.id)).map(s => s.id);
  }
  state.worldsUnlocked = WORLDS.map(w => w.id);

// normal mode: put the real save back exactly how it was

$('list').addEventListener('click', e => {
  if (e.target.id === 'modBtn') {
    state.modded ? exitModded() : enterModded();
    return;
  }
  // ask inside the game instead of using confirm(), which some browsers block:
  // first click asks "are you sure?", a second click within 4 seconds resets
  if (e.target.id === 'reset') {
    const r = e.target;
    if (!r.classList.contains('confirming')) {
      r.classList.add('confirming');
      r.textContent = '⚠️ Are you sure? Click again to reset everything';
      clearTimeout(r.timer);
      r.timer = setTimeout(() => { r.classList.remove('confirming'); r.textContent = '🗑️ Reset all progress'; }, 4000);
      return;
    }
    clearTimeout(r.timer);
    resetGame();
    toast('🗑️ Progress reset');
    return;
  }
  const btn = e.target.closest('.buy');
  if (!btn || btn.disabled || !btn.dataset.action) return;
  const [action, id] = btn.dataset.action.split(':');
  const cost = +btn.dataset.cost || 0;
  if (state.carrots < cost) return;
  state.carrots -= cost;

  const [verb, kind] = action.split('-');
  if (action === 'up') {
    const u = UPGRADES.find(x => x.key === id);
    state[id]++;
    questAdd('buys', 1);
    if (u.after) u.after();
    toast(typeof u.toast === 'function' ? u.toast() : u.toast);
  } else {
    if (verb === 'skin') { state[kind + 'Skins'].push(id); toast(SKIN_TOAST[kind]); }
    state[kind + 'Skin'] = id;
    if (kind === 'carrot') applyCarrotSkin();
    if (kind === 'cursor') applyCursorSkin();
  }

  // tap effects show off a preview right on the button
  const r = btn.getBoundingClientRect();
  if (kind === 'tap') tapEffect(r.left + r.width / 2, r.top + r.height / 2);
  else if (cost) burst(r.left + r.width / 2, r.top + r.height / 2);
  save();
  renderShop(false);
  render();
});

// ---------- daily quests: a new set every day at 6:00 AM (player's local time) ----------
const QUEST_POOL = [
  { id: 'click1k',  icon: '👆', text: 'Click the carrot 1,000 times',            stat: 'clicks',  goal: 1000, reward: 300000 },
  { id: 'click3k',  icon: '👆', text: 'Click the carrot 3,000 times',            stat: 'clicks',  goal: 3000, reward: 1e6 },
  { id: 'gold5',    icon: '✨', text: 'Catch 5 golden carrots',                   stat: 'golden',  goal: 5,    reward: 500000 },
  { id: 'gold15',   icon: '✨', text: 'Catch 15 golden carrots',                  stat: 'golden',  goal: 15,   reward: 2e6 },
  { id: 'crit50',   icon: '🍀', text: 'Land 50 CRIT clicks',                      stat: 'crits',   goal: 50,   reward: 750000 },
  { id: 'crit200',  icon: '🍀', text: 'Land 200 CRIT clicks',                     stat: 'crits',   goal: 200,  reward: 2.5e6 },
  { id: 'earn10m',  icon: '🥕', text: 'Earn 10M carrots',                         stat: 'earned',  goal: 1e7,  reward: 1.5e6 },
  { id: 'earn500m', icon: '🥕', text: 'Earn 500M carrots',                        stat: 'earned',  goal: 5e8,  reward: 5e7 },
  { id: 'buy15',    icon: '🛒', text: 'Buy 15 upgrades',                          stat: 'buys',    goal: 15,   reward: 400000 },
  { id: 'travel3',  icon: '🌀', text: 'Travel through the Carrot Portal 3 times', stat: 'travels', goal: 3,    reward: 600000 },
  { id: 'rush1',    icon: '🌟', text: 'Start a Golden Rush',                      stat: 'rushes',  goal: 1,    reward: 3e6 },
  { id: 'play20',   icon: '⏱️', text: 'Play for 20 minutes',                      stat: 'seconds', goal: 1200, reward: 800000 },
];
const QUESTS_PER_DAY = 4;
const RESET_HOUR = 6;

// "quest day" changes at 6 AM instead of midnight: shift the clock back 6 hours before reading the date
function questDayKey() {
  const d = new Date(Date.now() - RESET_HOUR * 3600e3);
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function nextReset() {
  const now = new Date(), r = new Date(now);
  r.setHours(RESET_HOUR, 0, 0, 0);
  if (r <= now) r.setDate(r.getDate() + 1);
  return r;
}
// everyone gets the same 4 quests on the same day (seeded by the date), each about something different
function pickQuests(day) {
  let h = 7;
  for (const c of day) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const pool = [...QUEST_POOL], out = [];
  while (out.length < QUESTS_PER_DAY && pool.length) {
    h = (h * 1103515245 + 12345) >>> 0;
    const q = pool.splice(h % pool.length, 1)[0];
    if (!out.some(o => o.stat === q.stat)) out.push(q);
  }
  return out;
}
let todaysQuests = [];
function checkQuestDay() {
  const day = questDayKey();
  if (state.questDay !== day) {
    const hadOld = !!state.questDay;
    Object.assign(state, { questDay: day, questStats: {}, questClaimed: [] });
    if (hadOld) toast('📋 New daily quests are here!');
  }
  if (!todaysQuests.length || todaysQuests.day !== day) {
    todaysQuests = pickQuests(day);
    todaysQuests.day = day;
  }
}
function questAdd(stat, n) { state.questStats[stat] = (state.questStats[stat] || 0) + n; }
const questProgress = q => Math.min(state.questStats[q.stat] || 0, q.goal);
const claimable = () => todaysQuests.filter(q => questProgress(q) >= q.goal && !state.questClaimed.includes(q.id)).length;

// which quests are in progress / done / claimed; the list only needs rebuilding when this changes
const questKey = () => todaysQuests.day + todaysQuests.map(q =>
  state.questClaimed.includes(q.id) ? 'c' : questProgress(q) >= q.goal ? 'd' : 'p').join('');
let questRenderedKey = '';

// animate = false rebuilds without the slide-in animation (so it doesn't look like it's refreshing)
function renderQuests(animate = true) {
  questRenderedKey = questKey();
  $('questList').classList.toggle('noanim', !animate);
  $('questList').innerHTML = todaysQuests.map((q, i) => {
    const p = questProgress(q), done = p >= q.goal, claimed = state.questClaimed.includes(q.id);
    const btn = claimed ? '<button class="buy done" disabled>Claimed ✓</button>'
      : done ? `<button class="buy" data-claim="${q.id}">Claim<br>🥕 ${fmt(q.reward)}</button>`
      : `<button class="buy" disabled>🥕 ${fmt(q.reward)}</button>`;
    return itemHTML({ i, ico: q.icon, name: q.text, btn, equipped: done && !claimed,
      desc: `<div class="qbar"><i style="width:${p / q.goal * 100}%"></i></div><span class="qtext">${fmt(p)} / ${fmt(q.goal)}</span>` })
      .replace('class="item', `class="item${done ? ' qdone' : ''}`);
  }).join('');
}
function updateQuestUI() {
  checkQuestDay();
  const n = claimable();
  for (const b of [$('qBadge'), $('lobbyQBadge')]) { b.hidden = !n; b.textContent = n; }
  const ms = nextReset() - Date.now();
  $('questTimer').textContent = `New quests in ${Math.floor(ms / 3600e3)}h ${Math.floor(ms / 60e3) % 60}m (every day at 6:00 AM)`;
  if (document.body.classList.contains('quests-open')) updateQuestRows();
}
// every second while the panel is open: just slide the progress bars and update the numbers in place
function updateQuestRows() {
  if (questKey() !== questRenderedKey) return renderQuests(false);
  todaysQuests.forEach((q, i) => {
    const row = $('questList').children[i];
    if (!row) return;
    const p = questProgress(q);
    row.querySelector('.qbar i').style.width = p / q.goal * 100 + '%';
    row.querySelector('.qtext').textContent = `${fmt(p)} / ${fmt(q.goal)}`;
  });
}
const openQuests = () => { closeShop(); closePortal(); updateQuestUI(); renderQuests(); document.body.classList.add('quests-open'); };
const closeQuests = () => document.body.classList.remove('quests-open');

// only touch the page when a value actually changed: rewriting text every frame makes the browser

function setText(node, text) { if (node.textContent !== text) node.textContent = text; }
function setHidden(el, hidden) { if (el.hidden !== hidden) el.hidden = hidden; }

function render() {
  const amount = fmt(state.carrots), word = Math.floor(state.carrots) === 1 ? 'carrot' : 'carrots';
  setText($('carrots').firstChild, amount);
  setText($('carrots').lastChild, word);
  setText($('clicksLabel'), state.clicks === 1 ? 'click' : 'clicks');
  setText($('clicks'), fmt(state.clicks));
  setText($('perSec'), fmt(perSec()));
  setText($('multi'), clickValue() + 'x');
  setHidden($('modChip'), !state.modded);
  setHidden($('beatChip'), !state.timesBeaten);
  setText($('beatCount'), String(state.timesBeaten));
  if (document.body.classList.contains('portal-open')) updatePortal();
  // reaching the goal in Space World: offer to end the game (once per goal)
  if (state.world === 'space' && state.carrots >= END_GOAL && state.endOfferedGoal < END_GOAL) showEndChoice();
  setHidden($('endBtn'), !(state.world === 'space' && state.carrots >= END_GOAL));

}

let last = performance.now();
function tick(now) {
  const dt = (now - last) / 1000;
  state.carrots += perSec() * dt;
  questAdd('earned', perSec() * dt);
  if (!lobbyOpen && !document.hidden) questAdd('seconds', dt);
  drawLineTrail(now);
  last = now;
  render();
  requestAnimationFrame(tick);
}

// auto clickers visibly "tap" the carrot once a second
setInterval(() => {
  if (!state.autos) return;
  floatAboveCarrot('+' + fmt(state.autos * autoValue()));
}, 1000);


// ---------- golden carrots: random bonus that pops up somewhere on screen ----------
// Golden Soil levels: how much more often golden carrots come, and how much they're worth
const SOIL_PERKS = ['', '2.5x as often · worth 1.5x', '4x as often · worth 2x · fly slower',
  '5.5x as often · worth 2.5x · fly slower · sometimes come in pairs'];
const soilFreq = () => 1 + state.golden * 1.5;
const soilWorth = () => 1 + state.golden * .5;

let goldenTimer;
function scheduleGolden(first) {
  const secs = (first ? 30 : 60) + Math.random() * 60;
  goldenTimer = setTimeout(spawnGolden, secs / soilFreq() * 1000);
}
function spawnGolden() {
  // none in Space World (it's the endgame), and none while the lobby is covering the screen
  if (state.world !== 'space' && !lobbyOpen) {
    const duration = state.golden >= 2 ? 12000 : 9000;
    flyGolden({ duration });
    if (state.golden >= 3 && Math.random() < .35) setTimeout(() => flyGolden({ duration }), 700);
  }
  scheduleGolden();
}

// the carrot's shadow glows gold, brighter with each Golden Soil level
function applySoil() {
  const s = document.querySelector('.shadow'), n = state.golden;
  s.style.background = n ? `rgba(255, 196, 40, ${.25 + n * .1})` : '';
  s.style.boxShadow = n ? `0 0 ${16 + n * 14}px ${4 + n * 4}px rgba(255, 200, 40, ${.25 + n * .12})` : '';
}

// one golden carrot flying across the screen (left→right or right→left) in a wavy line
function flyGolden({ duration = 9000, rush = false } = {}) {
  const g = document.createElement('button');
  g.className = 'golden';
  g.textContent = '🥕';
  g.setAttribute('aria-label', 'Golden carrot');
  g.style.top = (12 + Math.random() * 70) + 'vh';
  document.body.appendChild(g);
  const w = innerWidth, dir = Math.random() < .5 ? 1 : -1;
  const frames = [];
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    const x = dir > 0 ? -60 + t * (w + 120) : w + 60 - t * (w + 120);
    const y = Math.sin(t * Math.PI * 3) * 40;
    const tilt = Math.sin(t * Math.PI * 6) * 15 + dir * 20;
    frames.push({ transform: `translate(${x}px, ${y}px) rotate(${tilt}deg)` });
  }
  const flight = g.animate(frames, { duration, easing: 'linear' });
  flight.onfinish = () => g.remove();
  g.addEventListener('pointerdown', e => {
    if (g.dataset.caught || e.button !== 0) return;
    g.dataset.caught = 1;
    flight.cancel();
    g.remove();
    catchGolden(e.clientX, e.clientY, rush);
  });
  // Golden Magnet: partway across the screen, pull it into the carrot and collect it
  if (state.magnet) setTimeout(() => magnetPull(g, flight, rush), duration * (.2 + Math.random() * .3));
}

function magnetPull(g, flight, rush) {
  if (!state.magnet || g.dataset.caught || !g.isConnected) return;
  g.dataset.caught = 1;
  const from = g.getBoundingClientRect();
  const to = $('carrotBtn').getBoundingClientRect();
  const baseTop = g.offsetTop;
  flight.cancel();
  const tx = to.left + to.width / 2 - from.width / 2, ty = to.top + to.height * .4 - baseTop;
  g.animate([
    { transform: `translate(${from.left}px, ${from.top - baseTop}px) scale(1)` },
    { transform: `translate(${tx}px, ${ty}px) scale(.3) rotate(360deg)` },
  ], { duration: 550, easing: 'cubic-bezier(.5,0,.9,.6)', fill: 'forwards' }).onfinish = () => {
    g.remove();
    catchGolden(to.left + to.width / 2, to.top + to.height * .4, rush);
  };
}

function catchGolden(x, y, rush) {
  // rush carrots are worth a quarter each, since there are so many
  const reward = Math.max(100, perSec() * 15, clickValue() * 15) * soilWorth() / (rush ? 4 : 1);
  state.carrots += reward;
  state.goldenCaught++;
  questAdd('golden', 1);
  questAdd('earned', reward);
  burst(x, y);
  spawnFloat('+' + fmt(reward), x, y, 'gold');
  if (!rush) toast(`✨ Golden carrot! +${fmt(reward)} carrots`);
  bump($('goldCount'));
  if (state.goldenCaught % 50 === 0 && !rushing) goldenRush();
  render();
}

// every 50 golden carrots caught: a wave of 30–40 of them and a golden screen tint
let rushing = false;
function goldenRush() {
  rushing = true;
  questAdd('rushes', 1);
  const n = 30 + Math.floor(Math.random() * 11);
  $('goldTint').classList.add('on');
  toast(`✨ GOLDEN RUSH! ${n} golden carrots incoming!`);
  for (let i = 0; i < n; i++) {
    setTimeout(() => flyGolden({ duration: 4500 + Math.random() * 2500, rush: true }), i * 120 + Math.random() * 200);
  }
  setTimeout(() => { $('goldTint').classList.remove('on'); rushing = false; }, n * 120 + 7500);
}

// ---------- carrot cellar: offline earnings ----------
if (state.cellar && state.lastSeen) {
  const away = Math.min((Date.now() - state.lastSeen) / 1000, 8 * 3600);
  const earned = perSec() * away * .5;
  if (earned >= 1) {
    state.carrots += earned;
    setTimeout(() => toast(`🏚️ While you were away: +${fmt(earned)} carrots`), 600);
  }
}

checkQuestDay();
updateQuestUI();
setInterval(updateQuestUI, 1000);
scheduleGolden(true);
applySoil();
applyWorld();
applyCarrotSkin();
applyCursorSkin();
addEventListener('resize', moveTabPill);
setInterval(save, 3000);
addEventListener('beforeunload', save);
// phones often close tabs without beforeunload, so also save whenever the page is hidden
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
// no right-click / long-press menu on the carrot or golden carrots
document.addEventListener('contextmenu', e => { if (e.target.closest('#carrotBtn, .golden')) e.preventDefault(); });
requestAnimationFrame(tick);
</script>
</body>
</html>
