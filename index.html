<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrot Clicker</title>
<meta name="description" content="Click the carrot, buy upgrades and skins, and grow your carrot empire.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥕</text></svg>">
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f6f7f9; --line: #e8eaee; --text: #1d1f24; --muted: #8a8f99;
    --accent: #ff7a1a; --accent-soft: #fff1e6; --green: #2fb36b;
    --shadow: 0 10px 30px rgba(20, 24, 32, .08);
    --ease: cubic-bezier(.2, .9, .3, 1.2);
    /* carrot skin colors (changed by JS) */
    --b1: #ff9a3c; --b2: #f26200; --ridge: #cc4f00; --l1: #5fd36a; --l2: #3aa84a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Inter", "Segoe UI", system-ui, sans-serif; color: var(--text);
    background: var(--world-bg, radial-gradient(circle at 50% 45%, #fff 0%, var(--bg-soft) 75%)); overflow: hidden;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  }
  button { -webkit-tap-highlight-color: transparent; }
  html.custom-cursor, html.custom-cursor * { cursor: var(--cursor) !important; }

  /* ---------- stats ---------- */
  header { position: fixed; top: 32px; left: 0; right: 0; text-align: center; pointer-events: none; }
  #carrots { font-size: clamp(40px, 7vw, 64px); font-weight: 800; letter-spacing: -.02em; display: inline-block; }
  #carrots small { font-size: .45em; color: var(--muted); font-weight: 600; margin-left: 6px; }
  .stats { margin-top: 10px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 0 16px; }
  .chip { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--muted); box-shadow: 0 2px 8px rgba(0,0,0,.03); }
  .chip b { color: var(--text); }

  /* ---------- carrot ---------- */
  main { height: 100%; display: grid; place-items: center; }
  .carrot-wrap { position: relative; width: 340px; height: 340px; display: grid; place-items: center; margin-top: 90px; }
  #carrotBtn {
    width: 210px; height: 270px; border: none; background: none; padding: 0; cursor: pointer;
    animation: bob 3s ease-in-out infinite; -webkit-tap-highlight-color: transparent;
  }
  #carrotBtn svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 18px 18px rgba(255, 122, 26, .22)); transition: transform .25s var(--ease); }
  #carrotBtn:hover svg { transform: scale(1.05) rotate(-3deg); }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .shadow { position: absolute; bottom: 10px; width: 120px; height: 16px; border-radius: 50%; background: rgba(0,0,0,.07); animation: shadow 3s ease-in-out infinite; }
  @keyframes shadow { 50% { transform: scaleX(.85); opacity: .7; } }

  @keyframes spin { to { transform: rotate(360deg); } }

  .float { position: fixed; pointer-events: none; font-weight: 800; font-size: 22px; color: var(--accent); z-index: 25; }
  .particle { position: fixed; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 25; }
  .float.crit { font-size: 30px; color: #ff3d6e; white-space: nowrap; }
  .float.gold { font-size: 28px; color: #e0a800; white-space: nowrap; }
  #goldTint {
    position: fixed; inset: 0; z-index: 14; pointer-events: none; opacity: 0; transition: opacity .8s;
    background: radial-gradient(circle at 50% 45%, rgba(255, 220, 80, .12), rgba(255, 190, 30, .3));
  }
  #goldTint.on { opacity: 1; }
  .golden {
    position: fixed; left: 0; z-index: 15; font-size: 46px; border: none; background: none; padding: 0; cursor: pointer;
    filter: sepia(1) saturate(5) hue-rotate(-8deg) brightness(1.2) drop-shadow(0 0 14px #ffd23f);
  }
  .fx { position: fixed; pointer-events: none; z-index: 25; line-height: 1; }
  .trail { position: fixed; pointer-events: none; z-index: 40; line-height: 1; }

  /* ---------- shop ---------- */
  #shopBtn {
    position: fixed; right: 24px; top: 50%; transform: translateY(-50%); z-index: 10;
    border: none; background: var(--text); color: #fff; font: inherit; font-weight: 700; font-size: 16px;
    padding: 16px 22px; border-radius: 18px; cursor: pointer; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: transform .3s var(--ease), opacity .25s, background .2s;
  }
  #shopBtn .icon { font-size: 26px; }
  #shopBtn:hover { transform: translateY(-50%) scale(1.06); background: #000; }
  #shopBtn .dot { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .3s var(--ease); }
  #shopBtn.can-buy .dot { transform: scale(1); }
  body.shop-open #shopBtn { opacity: 0; transform: translateY(-50%) translateX(40px); pointer-events: none; }

  #scrim { position: fixed; inset: 0; background: rgba(20,24,32,.12); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 19; }
  body.shop-open #scrim { opacity: 1; pointer-events: auto; }

  #shop {
    position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(400px, calc(100vw - 24px)); z-index: 20;
    background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(20,24,32,.18);
    display: flex; flex-direction: column; transform: translateX(calc(100% + 24px));
    transition: transform .45s cubic-bezier(.2, .9, .25, 1);
  }
  body.shop-open #shop { transform: none; }
  .shop-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px; }
  .shop-head h2 { margin: 0; font-size: 22px; }
  .shop-head .bal { color: var(--muted); font-size: 14px; margin-top: 2px; }
  #closeShop, #closePortal { border: none; background: var(--bg-soft); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; transition: transform .2s var(--ease), background .2s; }
  #closeShop:hover, #closePortal:hover { transform: rotate(90deg); background: var(--line); }

  .tabs { display: flex; gap: 6px; margin: 8px 20px 4px; padding: 4px; background: var(--bg-soft); border-radius: 14px; position: relative; }
  .tab { flex: 1; border: none; background: none; font: inherit; font-weight: 600; font-size: 13px; color: var(--muted); padding: 9px 4px; border-radius: 10px; cursor: pointer; position: relative; z-index: 1; transition: color .2s; }
  .tab.active { color: var(--text); }
  .tab-pill { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 10px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.08); transition: transform .35s var(--ease), width .35s; }

  .list { flex: 1; overflow-y: auto; padding: 12px 20px 20px; }
  .item {
    display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 10px;
    background: #fff; transition: transform .2s var(--ease), box-shadow .2s, border-color .2s;
    animation: in .4s var(--ease) both;
  }
  .item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .item.equipped { border-color: var(--accent); background: var(--accent-soft); }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
  .item .ico { width: 52px; height: 52px; border-radius: 14px; background: var(--bg-soft); display: grid; place-items: center; font-size: 28px; flex-shrink: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 700; }
  .item .desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .buy {
    border: none; font: inherit; font-weight: 700; font-size: 14px; padding: 10px 14px; border-radius: 12px; cursor: pointer; white-space: nowrap;
    background: var(--accent); color: #fff; transition: transform .2s var(--ease), background .2s, opacity .2s;
  }
  .buy:hover:not(:disabled) { transform: scale(1.06); }
  .buy:active:not(:disabled) { transform: scale(.95); }
  .buy:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  .buy.ghost { background: var(--text); }
  .buy.done, .buy.done:disabled { background: var(--green); color: #fff; cursor: default; }

  .swatch { width: 26px; height: 34px; position: relative; }
  .swatch .leaf { position: absolute; left: 8px; top: 0; width: 10px; height: 10px; border-radius: 50% 50% 0 0; background: var(--sl); }
  .swatch .body { position: absolute; top: 8px; left: 0; right: 0; bottom: 0; clip-path: polygon(0 0, 100% 0, 52% 100%, 48% 100%); border-radius: 6px; background: linear-gradient(135deg, var(--sb1), var(--sb2)); }

  .mod-btn {
    display: block; width: 100%; margin-top: 6px; padding: 14px; border: 2px dashed #8a4dff; border-radius: 16px;
    background: #f5efff; color: #6a2fc0; font: inherit; font-weight: 700; cursor: pointer;
    transition: transform .2s var(--ease), background .2s;
  }
  .mod-btn:hover { transform: translateY(-2px); background: #ece1ff; }
  .mod-btn.normal { border: 2px solid var(--text); background: var(--text); color: #fff; }
  .mod-btn.normal:hover { background: #000; }
  .reset {
    display: block; width: 100%; margin-top: 10px; padding: 14px; border: none; border-radius: 16px;
    background: #e5383b; color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    transition: transform .2s var(--ease), background .2s;
  }
  .reset:hover { transform: translateY(-2px); background: #d02a2d; }
  .reset.confirming { background: #a4161a; animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 120px); background: var(--text); color: #fff;
    padding: 12px 20px; border-radius: 14px; font-weight: 600; box-shadow: var(--shadow); transition: transform .4s var(--ease); z-index: 30;
  }
  #toast.show { transform: translate(-50%, 0); }

  /* shows in Space World once you have enough carrots to finish */
  #endBtn {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 10;
    border: none; border-radius: 999px; padding: 14px 26px; cursor: pointer;
    background: linear-gradient(135deg, #ffd23f, #ff9a1a); color: #3b2300; font: inherit; font-weight: 800; font-size: 16px;
    box-shadow: 0 0 0 0 rgba(255, 196, 40, .6), 0 10px 30px rgba(255, 160, 30, .35); animation: endPulse 1.8s ease-out infinite;
  }
  #endBtn[hidden] { display: none; }
  #endBtn:hover { transform: translateX(-50%) scale(1.06); }
  @keyframes endPulse { 70%, 100% { box-shadow: 0 0 0 18px rgba(255, 196, 40, 0), 0 10px 30px rgba(255, 160, 30, .35); } }

  /* ---------- carrot portal ---------- */
  #portalBtn {
    position: fixed; right: 24px; top: calc(50% + 64px); z-index: 10;
    border: none; color: #fff; font: inherit; font-weight: 700; font-size: 13px; line-height: 1.15;
    background: linear-gradient(135deg, #8a4dff, #2f8be0); padding: 12px 10px; width: 92px; border-radius: 18px; cursor: pointer;
    box-shadow: 0 10px 30px rgba(90, 60, 220, .3);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    transition: transform .3s var(--ease), opacity .25s;
  }
  #portalBtn .icon { font-size: 24px; display: inline-block; animation: spin 4s linear infinite; }
  #portalBtn:hover { transform: scale(1.06); }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.shop-open #portalBtn, body.portal-open #portalBtn, body.portal-open #shopBtn { opacity: 0; pointer-events: none; }

  #portalScrim { position: fixed; inset: 0; background: rgba(20,24,32,.3); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 21; }
  body.portal-open #portalScrim { opacity: 1; pointer-events: auto; }
  #portal {
    position: fixed; left: 50%; top: 50%; z-index: 22; width: min(460px, calc(100vw - 24px)); max-height: calc(100vh - 40px);
    background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(20,24,32,.25); display: flex; flex-direction: column;
    transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none; transition: transform .35s var(--ease), opacity .25s;
  }
  body.portal-open #portal { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  .world-ico { width: 100%; height: 100%; border-radius: 14px; display: grid; place-items: center; }

  #warp {
    position: fixed; left: 50%; top: 50%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; border-radius: 50%;
    z-index: 50; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, #fff 0 12%, transparent 40%), conic-gradient(#8a4dff, #2f8be0, #5fd36a, #ff7a1a, #8a4dff);
  }

  /* ---------- worlds ---------- */
  #carrots { color: var(--hud, inherit); text-shadow: var(--hud-shadow, none); }
  body.world-water  { --world-bg: radial-gradient(circle at 50% 40%, #effaff 0%, #a6dcf5 55%, #4fa9d9 100%); --hud: #0d3b57; }
  body.world-lava   { --world-bg: radial-gradient(circle at 50% 45%, #6b200f 0%, #2e0a05 65%, #150302 100%); --hud: #fff; --hud-shadow: 0 2px 16px rgba(255,100,20,.6); }
  body.world-jungle { --world-bg: radial-gradient(circle at 50% 40%, #f0f9e6 0%, #acdc8e 55%, #4a9437 100%); --hud: #1f3d17; }
  body.world-space  { --world-bg: radial-gradient(circle at 50% 40%, #1d2256 0%, #0b0d26 60%, #03040d 100%); --hud: #fff; --hud-shadow: 0 2px 16px rgba(120,140,255,.6); }
  #ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #ambient > div { position: absolute; }
  .star { width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle var(--d) ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .15; } }

  /* ---------- ending ---------- */
  #endModal {
    position: fixed; inset: 0; z-index: 45; background: rgba(10,12,30,.55); display: grid; place-items: center;
    opacity: 0; pointer-events: none; transition: opacity .35s;
  }
  #endModal.show { opacity: 1; pointer-events: auto; }
  .end-card {
    background: #fff; border-radius: 28px; padding: 32px 26px 24px; width: min(440px, calc(100vw - 32px)); text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.35); transform: scale(.85); transition: transform .45s var(--ease);
  }
  #endModal.show .end-card { transform: scale(1); }
  .end-card .big { font-size: 64px; line-height: 1; }
  .end-card h2 { margin: 12px 0 6px; font-size: 28px; }
  .end-card p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; }
  .end-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .end-stats div { background: var(--bg-soft); border-radius: 14px; padding: 12px 4px; font-size: 12px; color: var(--muted); }
  .end-stats b { display: block; font-size: 18px; color: var(--text); }
  .big-btn {
    display: block; width: 100%; margin-top: 8px; padding: 14px; border: none; border-radius: 16px;
    font: inherit; font-weight: 700; cursor: pointer; transition: transform .2s var(--ease);
  }
  .big-btn:hover { transform: translateY(-2px); }
  .big-btn.primary { background: var(--accent); color: #fff; }
  .big-btn.dark { background: var(--text); color: #fff; }
  .big-btn.light { background: var(--bg-soft); color: var(--text); }

  @media (max-width: 600px) {
    #shopBtn { top: auto; bottom: 20px; transform: none; flex-direction: row; padding: 14px 20px; }
    #shopBtn:hover { transform: scale(1.04); }
    body.shop-open #shopBtn { transform: translateX(40px); }
    #portalBtn { top: auto; bottom: 20px; right: 140px; width: auto; flex-direction: row; padding: 14px 16px; font-size: 14px; }
    .carrot-wrap { width: 280px; height: 280px; }
    #carrotBtn { width: 170px; height: 220px; }
  }
</style>
</head>
<body>
<div id="ambient"></div>
<header>
  <div id="carrots">0<small>carrots</small></div>
  <div class="stats">
    <span class="chip">👆 <b id="clicks">0</b> <span id="clicksLabel">clicks</span></span>
    <span class="chip" id="goldChip">✨ <b id="goldCount" style="display:inline-block">0</b> golden</span>
    <span class="chip">⏱️ <b id="perSec">0</b> / sec</span>
    <span class="chip">✖️ <b id="multi">1x</b> multiplier</span>
    <span class="chip" id="worldChip">🌾 <b id="worldName">Carrot Farm</b></span>
    <span class="chip" id="modChip" style="color:#6a2fc0;border-color:#cdb4ff" hidden>🛠️ <b style="color:#6a2fc0">Modded</b></span>
    <span class="chip" id="beatChip" style="color:#b8860b;border-color:#f2d27a" hidden>🏆 <b style="color:#b8860b">Beaten <span id="beatCount">0</span>×</b></span>
  </div>
</header>

<main>
  <div class="carrot-wrap" id="wrap">
    <div class="shadow"></div>
    <button id="carrotBtn" aria-label="Click the carrot">
      <svg viewBox="0 0 200 260" aria-hidden="true">
        <defs>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color: var(--b1)"/>
            <stop offset="1" style="stop-color: var(--b2)"/>
          </linearGradient>
          <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color: var(--l1)"/>
            <stop offset="1" style="stop-color: var(--l2)"/>
          </linearGradient>
        </defs>
        <g transform="rotate(-20 100 130)">
        <!-- leaves -->
        <g fill="url(#leafGrad)">
          <path d="M100 62 C 70 50, 52 20, 62 6 C 82 12, 98 36, 100 62 Z"/>
          <path d="M100 62 C 130 50, 148 20, 138 6 C 118 12, 102 36, 100 62 Z"/>
          <path d="M100 64 C 88 40, 90 12, 100 0 C 110 12, 112 40, 100 64 Z"/>
        </g>
        <!-- body -->
        <g id="carrotBody">
          <path d="M52 78 C 60 58, 140 58, 148 78 C 156 98, 130 170, 108 238 C 104 250, 96 250, 92 238 C 70 170, 44 98, 52 78 Z" fill="url(#bodyGrad)"/>
          <g stroke="var(--ridge)" stroke-width="5" stroke-linecap="round" fill="none" opacity=".55">
            <path d="M64 140 q 12 4 22 0"/>
            <path d="M120 162 q 10 3 18 -2"/>
            <path d="M84 196 q 9 3 16 0"/>
            <path d="M126 104 q 8 3 14 -1"/>
          </g>
          <!-- shine -->
          <path d="M66 84 C 70 74, 84 70, 92 72" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".5"/>
        </g>
        </g>
      </svg>
    </button>
  </div>
</main>

<button id="shopBtn"><span class="dot"></span><span class="icon">🛒</span>Shop</button>
<div id="scrim"></div>

<aside id="shop" aria-label="Shop">
  <div class="shop-head">
    <div><h2>Shop</h2><div class="bal">🥕 <span id="shopBal">0</span> carrots</div></div>
    <button id="closeShop" aria-label="Close shop">✕</button>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab-pill" id="pill"></div>
    <button class="tab active" data-tab="upgrades">Upgrades</button>
    <button class="tab" data-tab="carrots">Carrots</button>
    <button class="tab" data-tab="cursors">Mice</button>
    <button class="tab" data-tab="trails">Trails</button>
    <button class="tab" data-tab="taps">Taps</button>
  </div>
  <div class="list" id="list"></div>
</aside>

<button id="endBtn" hidden>🏁 End the game</button>
<button id="portalBtn"><span class="icon">🌀</span>Carrot Portal</button>
<div id="portalScrim"></div>
<div id="portal" role="dialog" aria-label="Carrot Portal">
  <div class="shop-head">
    <div><h2>🌀 Carrot Portal</h2><div class="bal">Travel to new worlds. Each one multiplies all your carrots.</div></div>
    <button id="closePortal" aria-label="Close portal">✕</button>
  </div>
  <div class="list" id="worldList"></div>
</div>

<div id="endModal"><div class="end-card" id="endCard"></div></div>
<div id="warp"></div>

<div id="toast"></div>
<div id="goldTint"></div>

<script>
// boost: the equipped skin multiplies carrots per click
const CARROT_SKINS = [
  { id: 'classic', name: 'Classic',  cost: 0,      boost: 1,  b1: '#ff9a3c', b2: '#f26200', ridge: '#cc4f00', l1: '#5fd36a', l2: '#3aa84a' },
  { id: 'golden',  name: 'Golden',   cost: 5000,   boost: 2,  b1: '#ffe27a', b2: '#f2b600', ridge: '#c99500', l1: '#8fdc78', l2: '#4fae4a' },
  { id: 'purple',  name: 'Purple',   cost: 15000,  boost: 3,  b1: '#c890ff', b2: '#8040e0', ridge: '#6a2fc0', l1: '#5fd36a', l2: '#3aa84a' },
  { id: 'frozen',  name: 'Frozen',   cost: 40000,  boost: 5,  b1: '#e3f6ff', b2: '#7cc8f2', ridge: '#4ea6d6', l1: '#b4f0e8', l2: '#6bcfc0' },
  { id: 'midnight',name: 'Midnight', cost: 100000, boost: 10, b1: '#5a5f8a', b2: '#23263f', ridge: '#11131f', l1: '#7a86ff', l2: '#4450d8' },
];

// a bunny wearing a little hat, for shop icons
const hatBunnyIcon = hat => '<span style="position:relative;display:inline-block;line-height:1">🐰' +
  `<span style="position:absolute;left:50%;top:-.42em;transform:translateX(-50%) rotate(-12deg);font-size:.55em">${hat}</span></span>`;
const CROWNED_BUNNY = hatBunnyIcon('👑');
const HAT_BUNNY = hatBunnyIcon('🎩');

// an old-school pixel-art arrow pointer (B = black outline, W = white fill)
function pixelArrowSvg(scale = 2) {
  const rows = ['B', 'BB', 'BWB', 'BWWB', 'BWWWB', 'BWWWWB', 'BWWWWWB', 'BWWWWWWB', 'BWWWWWWWB', 'BWWWWWWWWB',
    'BWWWWWBBBBB', 'BWWBWWB', 'BWB.BWWB', 'BB..BWWB', 'B....BWWB', '.....BWWB', '......BB'];
  let rects = '';
  rows.forEach((row, y) => [...row].forEach((c, x) => {
    if (c !== '.') rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c === 'B' ? '#1d1f24' : '#fff'}"/>`;
  }));
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${11 * scale}" height="${17 * scale}" viewBox="0 0 11 17" shape-rendering="crispEdges">${rects}</svg>`;
}

// a chunky, cartoony arrow mouse pointer in any color, as an SVG string
function arrowSvg(color, size = 32) {
  const arrow = 'M5 3 L5 24 L10.5 19 L14.5 27.5 L19 25.5 L15 17.5 L22.5 17.5 Z';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 32 32">` +
    `<path d="${arrow}" transform="translate(1.5 1.5)" fill="rgba(0,0,0,.18)" stroke="rgba(0,0,0,.18)" stroke-width="2.6" stroke-linejoin="round"/>` +
    `<path d="${arrow}" fill="${color}" stroke="#1d1f24" stroke-width="2.6" stroke-linejoin="round"/>` +
    `<path d="M7.6 8 L7.6 15" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".7"/></svg>`;
}

const SAVE_KEY = 'carrotClickerSave';
const fresh = () => ({ carrots: 0, clicks: 0, autos: 0, mult: 1,

const fmt = n => {
  n = Math.floor(n);
  if (n < 1e6) return n.toLocaleString();
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi'];
  let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(2) + u[i];
};

// ---------- clicking ----------
function spawnFloat(text, x, y, cls = '') {
  const el = document.createElement('div');
  el.className = 'float ' + cls;
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  const dx = (Math.random() - .5) * 40;
  el.animate([
    { transform: 'translate(-50%, -50%) scale(.6)', opacity: 0 },
    { transform: 'translate(-50%, -90%) scale(1.15)', opacity: 1, offset: .15 },
    { transform: `translate(calc(-50% + ${dx * .6}px), -180%) scale(1)`, opacity: 1, offset: .6 },
    { transform: `translate(calc(-50% + ${dx}px), -260%) scale(1)`, opacity: 0 },
  ], { duration: 1000, easing: 'ease-out' }).onfinish = () => el.remove();
}

// "+N" pops up just above the top of the carrot
function floatAboveCarrot(text, cls) {
  const r = $('carrotBtn').getBoundingClientRect();
  spawnFloat(text, r.left + r.width / 2 + (Math.random() - .5) * 50, r.top + 10, cls);
}

function burst(x, y) {
  const colors = [getComputedStyle(document.documentElement).getPropertyValue('--b2'), '#5fd36a', '#ffd166'];
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = colors[i % colors.length];
    document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 50;
    p.animate([
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) scale(0)`, opacity: 0 },
    ], { duration: 600 + Math.random() * 200, easing: 'cubic-bezier(.1,.8,.3,1)' }).onfinish = () => p.remove();
  }
}

// ---------- tap effects ----------
const dot = (color, size = 8) => {
  const d = document.createElement('div');
  d.style.cssText = `width:${size}px;height:${size}px;border-radius:50%;background:${color};box-shadow:0 0 8px ${color}`;
  return d;
};
const emo = (text, size = 22) => {
  const d = document.createElement('div');
  d.textContent = text;
  d.style.fontSize = size + 'px';
  return d;
};

// throws n elements outward from (x, y), with optional gravity and spin
function fling(x, y, { n = 8, make, dist = [40, 90], dur = 700, gravity = 0, spin = 0, even = false }) {
  for (let i = 0; i < n; i++) {
    const el = make(i);
    el.classList.add('fx');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    const a = even ? i / n * Math.PI * 2 : Math.random() * Math.PI * 2;
    const d = dist[0] + Math.random() * (dist[1] - dist[0]);
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d, r = spin * (Math.random() - .5) * 2;
    el.animate([
      { transform: 'translate(-50%,-50%) rotate(0deg) scale(.6)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${r / 2}deg) scale(1)`, opacity: 1, offset: .55 },
      { transform: `translate(calc(-50% + ${dx * 1.15}px), calc(-50% + ${dy + gravity}px)) rotate(${r}deg) scale(.4)`, opacity: 0 },
    ], { duration: dur * (.85 + Math.random() * .3), easing: 'cubic-bezier(.15,.8,.3,1)' }).onfinish = () => el.remove();
  }
}

function ripple(x, y, color, delay = 0) {
  const el = document.createElement('div');
  el.className = 'fx';
  el.style.cssText = `left:${x}px;top:${y}px;width:24px;height:24px;border-radius:50%;border:3px solid ${color}`;
  document.body.appendChild(el);
  el.animate([
    { transform: 'translate(-50%,-50%) scale(.5)', opacity: .9 },
    { transform: 'translate(-50%,-50%) scale(5)', opacity: 0 },
  ], { duration: 600, delay, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' }).onfinish = () => el.remove();
}

function tapEffect(x, y) {
  const orange = getComputedStyle(document.documentElement).getPropertyValue('--b2');
  switch (state.tapSkin) {
    case 'stars':
      fling(x, y, { n: 6, make: () => emo('⭐', 20), dist: [50, 90], spin: 360, even: true });
      break;
    case 'carrots':
      fling(x, y, { n: 8, make: () => emo('🥕', 24), dist: [60, 110], dur: 900, gravity: 120, spin: 400 });
      break;
    case 'firework': {
      const hue = Math.random() * 360;
      fling(x, y, { n: 18, make: i => dot(`hsl(${hue + i * 8} 95% 60%)`, 7), dist: [80, 95], dur: 900, gravity: 30, even: true });
      ripple(x, y, `hsl(${hue} 95% 60%)`);
      break;
    }
    default:
      ripple(x, y, orange);
      ripple(x, y, orange, 120);
  }
}

// ---------- mouse trail ----------
let lastTrail = 0;
addEventListener('pointermove', e => {
  const t = TRAILS.find(k => k.id === state.trailSkin);
  if (!t || t.id === 'none') return;
  const style = TRAIL_STYLES[t.style] || (t.emoji ? TRAIL_STYLES.emoji : TRAIL_STYLES.dot);
  const now = performance.now();
  if (now - lastTrail < style.gap) return;
  const made = style.make(e.clientX, e.clientY, t);
  if (!made) return;
  lastTrail = now;
  const [el, frames, opts] = made;
  el.classList.add('trail');
  document.body.appendChild(el);
  el.animate(frames, opts).onfinish = () => el.remove();
});

const place = (el, x, y) => { el.style.left = x + 'px'; el.style.top = y + 'px'; return el; };
let lastPixel = '';
// each trail style: minimum ms between pieces, and make() -> [element, keyframes, options]
const TRAIL_STYLES = {
  dot: { gap: 16, make: (x, y, t) => [place(dot(t.color, 10), x, y), [
    { transform: 'translate(-50%,-50%) scale(1)', opacity: .9 },
    { transform: 'translate(-50%,-50%) scale(.2)', opacity: 0 }], { duration: 500, easing: 'ease-out' }] },

  emoji: { gap: 45, make: (x, y, t) => [place(emo(t.emoji, 18), x, y), [
    { transform: 'translate(-50%,-50%) scale(1)', opacity: .9 },
    { transform: 'translate(-50%, calc(-50% + 24px)) scale(.2)', opacity: 0 }], { duration: 700, easing: 'ease-out' }] },

  // chunky squares snapped to an 8px grid, fading out in steps
  pixel: { gap: 10, make: (x, y) => {
    const gx = Math.floor(x / 8) * 8, gy = Math.floor(y / 8) * 8;
    if (gx + ',' + gy === lastPixel) return null;
    lastPixel = gx + ',' + gy;
    const el = document.createElement('div');
    el.style.cssText = `width:8px;height:8px;background:${['#ff7a1a', '#ffa24a', '#f26200'][Math.random() * 3 | 0]}`;
    return [place(el, gx, gy), [{ opacity: 1 }, { opacity: 0 }], { duration: 600, easing: 'steps(4)' }];
  } },

  // dense glowing dots that shrink quickly, like a comet tail
  comet: { gap: 0, make: (x, y) => [place(dot('#ff8a2b', 9), x, y), [
    { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
    { transform: 'translate(-50%,-50%) scale(0)', opacity: .3 }], { duration: 350, easing: 'linear' }] },

  smoke: { gap: 30, make: (x, y) => {
    const el = document.createElement('div');
    el.style.cssText = 'width:18px;height:18px;border-radius:50%;background:rgba(130,136,148,.35);filter:blur(4px)';
    return [place(el, x, y), [
      { transform: 'translate(-50%,-50%) scale(1)', opacity: .6 },
      { transform: `translate(calc(-50% + ${(Math.random() - .5) * 20}px), calc(-50% - 24px)) scale(2.6)`, opacity: 0 }],
      { duration: 900, easing: 'ease-out' }];
  } },
};

function squish() {
  $('carrotBtn').querySelector('svg').animate([
    { transform: 'scale(1)' },
    { transform: 'scale(1.12)', offset: .35 },
    { transform: 'scale(1)' },
  ], { duration: 260, easing: 'ease-out' });
}

function bump(el) {
  el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 200, easing: 'ease-out' });
}

$('carrotBtn').addEventListener('pointerdown', e => {
  const crit = Math.random() < critChance();
  const gain = clickValue() * (crit ? 10 : 1);
  state.carrots += gain;
  state.clicks++;
  squish();
  tapEffect(e.clientX, e.clientY);
  floatAboveCarrot((crit ? 'CRIT! +' : '+') + fmt(gain), crit ? 'crit' : '');
  bump($('carrots'));
  render();
});

// ---------- skins ----------
function applyCarrotSkin() {
  const s = CARROT_SKINS.find(k => k.id === state.carrotSkin) || CARROT_SKINS[0];
  const root = document.documentElement.style;
  for (const k of ['b1', 'b2', 'ridge', 'l1', 'l2']) root.setProperty('--' + k, s[k]);
}

const cursorCache = {};
function emojiCursor(emoji) {
  if (cursorCache[emoji]) return cursorCache[emoji];
  const c = document.createElement('canvas');
  c.width = c.height = 40;
  const x = c.getContext('2d');
  x.font = '30px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText(emoji, 20, 22);
  return cursorCache[emoji] = `url(${c.toDataURL()}) 10 6, pointer`;
}
// a bunny emoji wearing a hat emoji (crown or top hat), drawn as a cursor
function hatBunnyCursor(hat) {
  if (cursorCache[hat + 'bunny']) return cursorCache[hat + 'bunny'];
  const c = document.createElement('canvas');
  c.width = c.height = 48;
  const x = c.getContext('2d');
  x.font = '30px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText('🐰', 22, 30);
  x.translate(23, 11);
  x.rotate(-.2);
  x.font = '17px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
  x.fillText(hat, 0, 0);
  return cursorCache[hat + 'bunny'] = `url(${c.toDataURL()}) 12 14, pointer`;
}

function applyCursorSkin() {
  const s = CURSOR_SKINS.find(k => k.id === state.cursorSkin) || CURSOR_SKINS[0];
  const html = document.documentElement;
  const cursor = s.emoji ? emojiCursor(s.emoji)
    : s.arrow ? `url("data:image/svg+xml,${encodeURIComponent(arrowSvg(s.arrow))}") 5 3, pointer`
    : s.pixel ? `url("data:image/svg+xml,${encodeURIComponent(pixelArrowSvg())}") 1 1, pointer`
    : s.hat ? hatBunnyCursor(s.hat) : null;
  html.classList.toggle('custom-cursor', !!cursor);
  if (cursor) html.style.setProperty('--cursor', cursor);
}

// ---------- shop ----------
let tab = 'upgrades';
const SKIN_TABS = { carrots: ['carrot', CARROT_SKINS], cursors: ['cursor', CURSOR_SKINS], trails: ['trail', TRAILS], taps: ['tap', TAPS] };
const SKIN_LABEL = { carrot: 'Carrot skin', cursor: 'Mouse skin', trail: 'Mouse trail', tap: 'Tap effect' };
const SKIN_TOAST = { carrot: '🥕 New carrot skin!', cursor: '✨ New mouse skin!', trail: '🌈 New mouse trail!', tap: '💥 New tap effect!' };

function itemHTML({ ico, name, desc, btn, equipped, i }) {
  return `<div class="item${equipped ? ' equipped' : ''}" style="animation-delay:${i * 40}ms">
    <div class="ico">${ico}</div>
    <div class="info"><div class="name">${name}</div><div class="desc">${desc}</div></div>
    ${btn}</div>`;
}
const buyBtn = (action, cost) =>
  `<button class="buy" data-action="${action}" data-cost="${cost}">🥕 ${fmt(cost)}</button>`;

function skinRow(s, i, kind) {
  const owned = state[kind + 'Skins'].includes(s.id);
  const equipped = state[kind + 'Skin'] === s.id;
  const ico = kind === 'carrot'
    ? `<div class="swatch" style="--sb1:${s.b1};--sb2:${s.b2};--sl:${s.l1}">
         <div class="leaf"></div><div class="body"></div></div>`
    : s.icon || s.emoji;
  const btn = equipped ? '<button class="buy done" disabled>Equipped</button>'
    : owned ? `<button class="buy ghost" data-action="equip-${kind}:${s.id}">Equip</button>`
    : buyBtn(`skin-${kind}:${s.id}`, s.cost);
  let desc = s.secret ? '🏆 Earned by beating the game 3 times' : s.cost ? (owned ? 'Owned' : SKIN_LABEL[kind]) : 'Free';
  if (s.boost) desc = `<b style="color:var(--accent)">${s.boost}x carrots per click</b> · ${desc}`;
  return itemHTML({ ico, name: s.name, desc, btn, equipped, i });
}

function renderShop() {
  let html = '';
  if (tab === 'upgrades') {
    html = UPGRADES.map((u, i) => {
      const n = state[u.key];
      const maxed = u.max && n >= u.max;
      const tag = u.tag ? ` <span style="color:var(--muted);font-weight:600">· ${u.tag(n)}</span>` : '';
      return itemHTML({ i, ico: u.ico, name: u.name + tag, desc: u.desc(n),
        btn: maxed ? '<button class="buy done" disabled>Maxed</button>' : buyBtn('up:' + u.key, u.cost(n)) });
    }).join('');
  } else {
    const [kind, list] = SKIN_TABS[tab];
    html = list.filter(s => !s.secret || state[kind + 'Skins'].includes(s.id)).map((s, i) => skinRow(s, i, kind)).join('');
  }
  const modBtn = state.modded
    ? '<button class="mod-btn normal" id="modBtn">↩️ Back to normal mode</button>'
    : '<button class="mod-btn" id="modBtn">🔓 Unlock all (modded)</button>';
  $('list').innerHTML = html + modBtn + '<button class="reset" id="reset">🗑️ Reset all progress</button>';
  updateButtons();
}

function updateButtons() {
  for (const b of $('list').querySelectorAll('.buy[data-cost]')) b.disabled = state.carrots < +b.dataset.cost;
  const anyAffordable = UPGRADES.some(u => !(u.max && state[u.key] >= u.max) && state.carrots >= u.cost(state[u.key]));
  $('shopBtn').classList.toggle('can-buy', anyAffordable);
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- worlds ----------
function applyWorld() {
  const w = worldOf(state.world);
  for (const x of WORLDS) document.body.classList.toggle('world-' + x.id, x.id === w.id);
  $('worldChip').firstChild.textContent = w.emoji + ' ';
  $('worldName').textContent = w.name + (w.boost > 1 ? ` · ${w.boost}x` : '');
  startAmbient(w.id);
}

// background effects for each world
const rnd = (a, b) => a + Math.random() * (b - a);
function ambientPiece(css) {
  const el = document.createElement('div');
  el.style.cssText = css;
  $('ambient').appendChild(el);
  return el;
}
function rise(css, size, dur, wobble) {
  const el = ambientPiece(`${css};width:${size}px;height:${size}px;left:${rnd(0, 100)}%;top:100%`);
  const dx = rnd(-wobble, wobble);
  el.animate([
    { transform: 'translate(0, 0)', opacity: 0 },
    { transform: `translate(${dx}px, ${-innerHeight * .5}px)`, opacity: 1, offset: .4 },
    { transform: `translate(${-dx}px, ${-innerHeight - 60}px)`, opacity: 0 },
  ], { duration: dur, easing: 'linear' }).onfinish = () => el.remove();
}
const AMBIENT = {
  water: () => rise('border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.18);border-radius:50%', rnd(6, 20), rnd(6000, 10000), 30),
  lava: () => {
    const c = ['#ffd166', '#ff9a3c', '#ff5a1a'][Math.random() * 3 | 0];
    rise(`background:${c};border-radius:50%;box-shadow:0 0 10px 2px ${c}`, rnd(3, 7), rnd(4000, 7000), 40);
  },
  jungle: () => {
    const el = ambientPiece(`width:16px;height:9px;border-radius:0 100% 0 100%;left:${rnd(0, 100)}%;top:-20px;` +
      `background:${['#4caf50', '#7cc35a', '#2e7d32'][Math.random() * 3 | 0]}`);
    const dx = rnd(-120, 120), spin = rnd(360, 900);
    el.animate([
      { transform: 'translate(0, 0) rotate(0deg)', opacity: .9 },
      { transform: `translate(${dx}px, ${innerHeight + 40}px) rotate(${spin}deg)`, opacity: .9 },
    ], { duration: rnd(7000, 11000), easing: 'ease-in-out' }).onfinish = () => el.remove();
  },
  space: () => {  // shooting star
    const el = ambientPiece(`width:90px;height:2px;left:${rnd(0, 60)}%;top:${rnd(0, 45)}%;` +
      'background:linear-gradient(270deg, #fff, transparent);border-radius:2px');
    el.animate([
      { transform: 'translate(0, 0) rotate(21.8deg)', opacity: 0 },
      { opacity: 1, offset: .2 },
      { transform: 'translate(320px, 128px) rotate(21.8deg)', opacity: 0 },
    ], { duration: 900, easing: 'ease-out' }).onfinish = () => el.remove();
  },
};
let ambientTimer;
function startAmbient(id) {
  clearInterval(ambientTimer);
  $('ambient').innerHTML = '';
  if (id === 'space') {
    for (let i = 0; i < 90; i++) {
      const s = ambientPiece(`left:${rnd(0, 100)}%;top:${rnd(0, 100)}%;--d:${rnd(2, 5)}s;animation-delay:-${rnd(0, 5)}s`);
      s.className = 'star';
      s.style.width = s.style.height = rnd(1, 3) + 'px';
    }
  }
  if (!AMBIENT[id]) return;
  ambientTimer = setInterval(() => { if (!document.hidden) AMBIENT[id](); }, id === 'space' ? 2500 : 450);
}

// ---------- carrot portal ----------
let portalKey = '';
function renderPortal() {
  $('worldList').innerHTML = WORLDS.map((w, i) => {
    const unlocked = state.worldsUnlocked.includes(w.id);
    const current = state.world === w.id;
    const reachable = i === 0 || state.worldsUnlocked.includes(WORLDS[i - 1].id);
    let btn;
    if (current && w.id === 'space' && state.carrots >= END_GOAL) btn = '<button class="buy" data-end>🏁 End game</button>';
    else if (current) btn = '<button class="buy done" disabled>You\'re here</button>';
    else if (unlocked) btn = `<button class="buy ghost" data-world="${w.id}">Travel</button>`;
    else if (reachable) btn = `<button class="buy" data-world="${w.id}" data-cost="${w.cost}">🥕 ${fmt(w.cost)}</button>`;
    else btn = '<button class="buy" disabled>🔒 Locked</button>';
    const tag = ` <span style="color:var(--muted);font-weight:600">· ${w.boost}x carrots</span>`;
    const desc = !unlocked && !reachable ? `Unlock ${WORLDS[i - 1].name} first` : w.desc;
    return itemHTML({ i, ico: `<div class="world-ico" style="background:${w.bg}">${w.emoji}</div>`,
      name: w.name + tag, desc, btn, equipped: current });
  }).join('');
  portalKey = state.world + (state.carrots >= END_GOAL);
}
function updatePortal() {
  if (portalKey !== state.world + (state.carrots >= END_GOAL)) renderPortal();
  for (const b of $('worldList').querySelectorAll('.buy[data-cost]')) b.disabled = state.carrots < +b.dataset.cost;
}
const openPortal = () => { closeShop(); renderPortal(); updatePortal(); document.body.classList.add('portal-open'); };
const closePortal = () => document.body.classList.remove('portal-open');
$('portalBtn').addEventListener('click', openPortal);
$('closePortal').addEventListener('click', closePortal);
$('portalScrim').addEventListener('click', closePortal);

$('worldList').addEventListener('click', e => {
  const btn = e.target.closest('.buy');
  if (!btn || btn.disabled) return;
  if ('end' in btn.dataset) { closePortal(); endGame(); return; }
  const w = worldOf(btn.dataset.world);
  if (!state.worldsUnlocked.includes(w.id)) {
    if (state.carrots < w.cost) return;
    state.carrots -= w.cost;
    state.worldsUnlocked.push(w.id);
  }
  closePortal();
  travel(w);
});

// swirl the screen, switch worlds at the peak, then swirl back out
function travel(w) {
  const warp = $('warp');
  warp.getAnimations().forEach(a => a.cancel());
  warp.animate([
    { opacity: 0, transform: 'scale(.2) rotate(0deg)' },
    { opacity: 1, transform: 'scale(1) rotate(270deg)' },
  ], { duration: 700, easing: 'ease-in', fill: 'forwards' }).onfinish = () => {
    state.world = w.id;
    applyWorld();
    save();
    render();
    warp.animate([
      { opacity: 1, transform: 'scale(1) rotate(270deg)' },
      { opacity: 0, transform: 'scale(1.4) rotate(400deg)' },
    ], { duration: 800, easing: 'ease-out', fill: 'forwards' });
    toast(`${w.emoji} Welcome to ${w.name}!` + (w.boost > 1 ? ` All carrots ${w.boost}x` : ''));
  };
}

// ---------- ending ----------
function showEndModal(html) {
  $('endCard').innerHTML = html;
  $('endModal').classList.add('show');
}
const hideEndModal = () => $('endModal').classList.remove('show');

function showEndChoice() {
  state.endOfferedGoal = END_GOAL;
  save();
  showEndModal(`<div class="big">🚀</div>
    <h2>You made it!</h2>
    <p>You reached <b>100,000,000 carrots</b> in Space World!<br>
      End the game to win and start over from the beginning with 0 carrots, or keep playing?</p>
    <button class="big-btn primary" data-act="end">🏁 End the game</button>
    <button class="big-btn light" data-act="keep">Keep playing</button>`);
}

// finishing the game: counts a win, then sends you back to the very beginning.
// Wins and the Admin Bunny (earned on the 3rd win) are kept. Wins in modded mode don't count.
function endGame() {
  const stats = { clicks: state.clicks, golden: state.goldenCaught, carrots: state.carrots };
  const counted = !state.modded;
  const wins = state.timesBeaten + (counted ? 1 : 0);
  const hadAdmin = state.cursorSkins.includes('admin');
  const newAdmin = counted && wins >= 3 && !hadAdmin;
  const adminOn = newAdmin || (hadAdmin && state.cursorSkin === 'admin');

  resetGame();
  state.timesBeaten = wins;
  if (hadAdmin || newAdmin) state.cursorSkins.push('admin');
  if (adminOn) state.cursorSkin = 'admin';
  refreshAll();

  const extra = newAdmin
    ? `<div class="item equipped" style="text-align:left;margin-bottom:12px;animation:none">
         <div class="ico" style="font-size:30px">${HAT_BUNNY}</div>
         <div class="info"><div class="name">New cursor: The Admin Bunny!</div>
         <div class="desc">You beat the game 3 times. It's equipped now, and it's in your shop under Mice.</div></div></div>`
    : !counted ? '<p>Wins in modded mode don\'t count toward your total.</p>'
    : wins < 3 ? `<p>Beat it <b>${3 - wins} more time${3 - wins === 1 ? '' : 's'}</b> to unlock a secret cursor 👀</p>` : '';
  showEndModal(`<div class="big">🏆</div>
    <h2>You beat Carrot Clicker!</h2>
    <p>From one carrot on a farm all the way to space. Wins: <b>${wins}</b></p>
    <div class="end-stats">
      <div><b>${fmt(stats.clicks)}</b>clicks</div>
      <div><b>${fmt(stats.golden)}</b>golden carrots</div>
      <div><b>${fmt(stats.carrots)}</b>carrots</div>
    </div>
    ${extra}
    <button class="big-btn primary" data-act="keep">🥕 Start again</button>`);
  const r = $('endCard').getBoundingClientRect();
  fling(r.left + r.width / 2, r.top + 60, { n: 14, make: () => emo('⭐', 22), dist: [90, 180], dur: 1200, spin: 360, even: true });
}

$('endBtn').addEventListener('click', showEndChoice);

$('endModal').addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'end') endGame();
  else if (act === 'keep') { hideEndModal(); render(); }
});

function resetGame() {
  state = fresh();
  $('goldTint').classList.remove('on');
  document.querySelectorAll('.golden').forEach(g => g.remove());
  clearTimeout(goldenTimer);
  scheduleGolden(true);
  refreshAll();
}

function refreshAll() {
  save();
  applyCarrotSkin();
  applyCursorSkin();
  applySoil();
  applyWorld();
  renderShop();
  render();
}

// modded mode: remember the real save, then give 1B carrots and unlock everything
function enterModded() {
  state.backup = JSON.parse(JSON.stringify(state));
  state.modded = true;
  state.carrots = 1e9;
  for (const u of UPGRADES) state[u.key] = u.max || Math.max(state[u.key], 10);
  for (const [kind, list] of Object.values(SKIN_TABS)) {
    state[kind + 'Skins'] = list.filter(s => !s.secret || state[kind + 'Skins'].includes(s.id)).map(s => s.id);
  }
  state.worldsUnlocked = WORLDS.map(w => w.id);
  refreshAll();
  toast('🔓 Modded mode: everything unlocked!');
}
// normal mode: put the real save back exactly how it was
function exitModded() {
  state = Object.assign(fresh(), state.backup, { modded: false, backup: null });
  refreshAll();
  toast('↩️ Back to normal mode');
}

$('list').addEventListener('click', e => {
  if (e.target.id === 'modBtn') {
    state.modded ? exitModded() : enterModded();
    return;
  }
  // ask inside the game instead of using confirm(), which some browsers block:
  // first click asks "are you sure?", a second click within 4 seconds resets
  if (e.target.id === 'reset') {
    const r = e.target;
    if (!r.classList.contains('confirming')) {
      r.classList.add('confirming');
      r.textContent = '⚠️ Are you sure? Click again to reset everything';
      clearTimeout(r.timer);
      r.timer = setTimeout(() => { r.classList.remove('confirming'); r.textContent = '🗑️ Reset all progress'; }, 4000);
      return;
    }
    clearTimeout(r.timer);
    resetGame();
    toast('🗑️ Progress reset');
    return;
  }
  const btn = e.target.closest('.buy');
  if (!btn || btn.disabled || !btn.dataset.action) return;
  const [action, id] = btn.dataset.action.split(':');
  const cost = +btn.dataset.cost || 0;
  if (state.carrots < cost) return;
  state.carrots -= cost;

  const [verb, kind] = action.split('-');
  if (action === 'up') {
    const u = UPGRADES.find(x => x.key === id);
    state[id]++;
    if (u.after) u.after();
    toast(typeof u.toast === 'function' ? u.toast() : u.toast);
  } else {
    if (verb === 'skin') { state[kind + 'Skins'].push(id); toast(SKIN_TOAST[kind]); }
    state[kind + 'Skin'] = id;
    if (kind === 'carrot') applyCarrotSkin();
    if (kind === 'cursor') applyCursorSkin();
  }

  // tap effects show off a preview right on the button
  const r = btn.getBoundingClientRect();
  if (kind === 'tap') tapEffect(r.left + r.width / 2, r.top + r.height / 2);
  else if (cost) burst(r.left + r.width / 2, r.top + r.height / 2);
  save();
  renderShop();
  render();
});

function moveTabPill() {
  const active = document.querySelector('.tab.active');
  $('pill').style.width = active.offsetWidth + 'px';
  $('pill').style.transform = `translateX(${active.offsetLeft - 4}px)`;
}
$('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  tab = t.dataset.tab;
  moveTabPill();
  renderShop();
});

const openShop = () => { document.body.classList.add('shop-open'); renderShop(); requestAnimationFrame(moveTabPill); };
const closeShop = () => document.body.classList.remove('shop-open');
$('shopBtn').addEventListener('click', openShop);
$('closeShop').addEventListener('click', closeShop);
$('scrim').addEventListener('click', closeShop);
addEventListener('keydown', e => { if (e.key === 'Escape') { closeShop(); closePortal(); } });

// ---------- loop ----------
function render() {
  $('carrots').firstChild.textContent = fmt(state.carrots);
  $('carrots').lastChild.textContent = Math.floor(state.carrots) === 1 ? 'carrot' : 'carrots';
  $('clicksLabel').textContent = state.clicks === 1 ? 'click' : 'clicks';
  $('clicks').textContent = fmt(state.clicks);
  $('perSec').textContent = fmt(perSec());
  $('multi').textContent = clickValue() + 'x';
  $('modChip').hidden = !state.modded;
  $('beatChip').hidden = !state.timesBeaten;
  $('beatCount').textContent = state.timesBeaten;
  if (document.body.classList.contains('portal-open')) updatePortal();
  // reaching 1M in Space World: offer to end the game (once)
  if (state.world === 'space' && state.carrots >= END_GOAL && state.endOfferedGoal < END_GOAL) showEndChoice();
  $('endBtn').hidden = !(state.world === 'space' && state.carrots >= END_GOAL);
  $('goldCount').textContent = fmt(state.goldenCaught);
  $('shopBal').textContent = fmt(state.carrots);
  document.title = `${fmt(state.carrots)} ${$('carrots').lastChild.textContent} · Carrot Clicker`;
  updateButtons();
}

let last = performance.now();
function tick(now) {
  state.carrots += perSec() * (now - last) / 1000;
  last = now;
  render();
  requestAnimationFrame(tick);
}

// auto clickers visibly "tap" the carrot once a second
setInterval(() => {
  if (!state.autos) return;
  floatAboveCarrot('+' + fmt(state.autos * autoValue()));
}, 1000);


// ---------- golden carrots: random bonus that pops up somewhere on screen ----------
// Golden Soil levels: how much more often golden carrots come, and how much they're worth
const SOIL_PERKS = ['', '2.5x as often · worth 2x', '4x as often · worth 3x · fly slower',
  '5.5x as often · worth 4x · fly slower · sometimes come in pairs'];
const soilFreq = () => 1 + state.golden * 1.5;
const soilWorth = () => 1 + state.golden;

let goldenTimer;
function scheduleGolden(first) {
  const secs = (first ? 30 : 60) + Math.random() * 60;
  goldenTimer = setTimeout(spawnGolden, secs / soilFreq() * 1000);
}
function spawnGolden() {
  const duration = state.golden >= 2 ? 12000 : 9000;
  flyGolden({ duration });
  if (state.golden >= 3 && Math.random() < .35) setTimeout(() => flyGolden({ duration }), 700);
  scheduleGolden();
}

// the carrot's shadow glows gold, brighter with each Golden Soil level
function applySoil() {
  const s = document.querySelector('.shadow'), n = state.golden;
  s.style.background = n ? `rgba(255, 196, 40, ${.25 + n * .1})` : '';
  s.style.boxShadow = n ? `0 0 ${16 + n * 14}px ${4 + n * 4}px rgba(255, 200, 40, ${.25 + n * .12})` : '';
}

// one golden carrot flying across the screen (left→right or right→left) in a wavy line
function flyGolden({ duration = 9000, rush = false } = {}) {
  const g = document.createElement('button');
  g.className = 'golden';
  g.textContent = '🥕';
  g.setAttribute('aria-label', 'Golden carrot');
  g.style.top = (12 + Math.random() * 70) + 'vh';
  document.body.appendChild(g);
  const w = innerWidth, dir = Math.random() < .5 ? 1 : -1;
  const frames = [];
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    const x = dir > 0 ? -60 + t * (w + 120) : w + 60 - t * (w + 120);
    const y = Math.sin(t * Math.PI * 3) * 40;
    const tilt = Math.sin(t * Math.PI * 6) * 15 + dir * 20;
    frames.push({ transform: `translate(${x}px, ${y}px) rotate(${tilt}deg)` });
  }
  const flight = g.animate(frames, { duration, easing: 'linear' });
  flight.onfinish = () => g.remove();
  g.addEventListener('pointerdown', e => {
    if (g.dataset.caught) return;
    g.dataset.caught = 1;
    flight.cancel();
    g.remove();
    catchGolden(e.clientX, e.clientY, rush);
  });
  // Golden Magnet: partway across the screen, pull it into the carrot and collect it
  if (state.magnet) setTimeout(() => magnetPull(g, flight, rush), duration * (.2 + Math.random() * .3));
}

function magnetPull(g, flight, rush) {
  if (!state.magnet || g.dataset.caught || !g.isConnected) return;
  g.dataset.caught = 1;
  const from = g.getBoundingClientRect();
  const to = $('carrotBtn').getBoundingClientRect();
  const baseTop = g.offsetTop;
  flight.cancel();
  const tx = to.left + to.width / 2 - from.width / 2, ty = to.top + to.height * .4 - baseTop;
  g.animate([
    { transform: `translate(${from.left}px, ${from.top - baseTop}px) scale(1)` },
    { transform: `translate(${tx}px, ${ty}px) scale(.3) rotate(360deg)` },
  ], { duration: 550, easing: 'cubic-bezier(.5,0,.9,.6)', fill: 'forwards' }).onfinish = () => {
    g.remove();
    catchGolden(to.left + to.width / 2, to.top + to.height * .4, rush);
  };
}

function catchGolden(x, y, rush) {
  // rush carrots are worth a quarter each, since there are so many
  const reward = Math.max(100, perSec() * 60, clickValue() * 50) * soilWorth() / (rush ? 4 : 1);
  state.carrots += reward;
  state.goldenCaught++;
  burst(x, y);
  spawnFloat('+' + fmt(reward), x, y, 'gold');
  if (!rush) toast(`✨ Golden carrot! +${fmt(reward)} carrots`);
  bump($('goldCount'));
  if (state.goldenCaught % 50 === 0 && !rushing) goldenRush();
  render();
}

// every 50 golden carrots caught: a wave of 30–40 of them and a golden screen tint
let rushing = false;
function goldenRush() {
  rushing = true;
  const n = 30 + Math.floor(Math.random() * 11);
  $('goldTint').classList.add('on');
  toast(`✨ GOLDEN RUSH! ${n} golden carrots incoming!`);
  for (let i = 0; i < n; i++) {
    setTimeout(() => flyGolden({ duration: 4500 + Math.random() * 2500, rush: true }), i * 120 + Math.random() * 200);
  }
  setTimeout(() => { $('goldTint').classList.remove('on'); rushing = false; }, n * 120 + 7500);
}

// ---------- carrot cellar: offline earnings ----------
if (state.cellar && state.lastSeen) {
  const away = Math.min((Date.now() - state.lastSeen) / 1000, 8 * 3600);
  const earned = perSec() * away * .5;
  if (earned >= 1) {
    state.carrots += earned;
    setTimeout(() => toast(`🏚️ While you were away: +${fmt(earned)} carrots`), 600);
  }
}

scheduleGolden(true);
applySoil();
applyWorld();
applyCarrotSkin();
applyCursorSkin();
addEventListener('resize', moveTabPill);
setInterval(save, 3000);
addEventListener('beforeunload', save);
// phones often close tabs without beforeunload, so also save whenever the page is hidden
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
$('carrotBtn').addEventListener('contextmenu', e => e.preventDefault());
requestAnimationFrame(tick);
</script>
</body>
</html>
